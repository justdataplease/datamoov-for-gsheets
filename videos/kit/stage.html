<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>DataMoov video stage</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Roboto+Mono:wght@400;500&display=swap">
<style>
  /* The stage is a fixed 1600 x 1000 "world" (Sheets with the DataMoov sidebar docked) seen
     through a camera that pans and zooms inside whatever frame the video is recorded at.
     Cards and captions sit above the camera, at frame size. Sample data only. */
  :root {
    --ground: #0b0b12;
    --chrome: #ffffff;
    --line: #e1e3e1;
    --ink: #202124;
    --muted: #5f6368;
    --indigo: #5146d6;
    --dock: 380px;
    font-family: Inter, 'Segoe UI', Roboto, Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--ground); }

  #camera { position: absolute; left: 0; top: 0; width: 1600px; height: 1000px;
    transform-origin: 0 0; }
  .app { position: absolute; inset: 0; display: grid; grid-template-rows: 56px 40px auto 1fr 38px;
    background: #f8f9fa; color: var(--ink); border-radius: 14px; overflow: hidden;
    box-shadow: 0 50px 120px -30px rgba(0, 0, 0, .8), 0 0 0 1px rgba(255, 255, 255, .06); }

  /* Sheets chrome ------------------------------------------------------- */
  .titlebar { display: flex; align-items: center; gap: 12px; padding: 0 18px; background: var(--chrome); }
  .titlebar svg { width: 28px; height: 28px; flex: none; }
  .doc strong { display: block; font-size: 17px; font-weight: 500; }
  .menu { display: flex; gap: 15px; font-size: 12.5px; color: var(--muted); margin-top: 2px; }
  .menu .on { color: var(--indigo); font-weight: 600; }
  .right { margin-left: auto; display: flex; align-items: center; gap: 10px; }
  .share { background: #c2e7ff; color: #001d35; font-size: 13px; font-weight: 500; padding: 8px 18px;
    border-radius: 100px; }
  .avatar { width: 30px; height: 30px; border-radius: 100px; background: #8a8fa3; }
  .toolbar { display: flex; align-items: center; gap: 6px; padding: 0 14px; background: var(--chrome);
    border-bottom: 1px solid var(--line); color: var(--muted); font-size: 13px; }
  .toolbar span { min-width: 26px; text-align: center; }
  .toolbar i { width: 1px; height: 18px; background: var(--line); margin: 0 6px; }

  /* Body: the sheet and the dock ------------------------------------------ */
  /* The formula bar: the selected cell's name and what it holds; a long formula wraps. */
  .fbar { display: flex; align-items: flex-start; min-height: 30px; background: var(--chrome);
    border-bottom: 1px solid var(--line); font-size: 13px; color: var(--ink); }
  .fbar .name { flex: none; width: 86px; padding: 7px 10px; border-right: 1px solid var(--line);
    color: var(--muted); }
  .fbar .fx { flex: none; padding: 6px 10px; color: #9aa0a6; font-style: italic; font-weight: 600; }
  .fbar .value { flex: 1; padding: 6px 12px 6px 0; font: 14px/1.45 'Roboto Mono', Consolas, monospace;
    white-space: pre-wrap; word-break: break-all; }
  .fbar .value .ref { color: #c5221f; }
  .fbar .value .fn { color: #0b57d0; }
  .body { position: relative; display: grid; grid-template-columns: 1fr var(--dock); min-height: 0;
    background: #fff; transition: grid-template-columns .9s cubic-bezier(.65, 0, .35, 1); }
  .body.closed { grid-template-columns: 1fr 0; }
  .sheet { position: relative; overflow: hidden; }
  .blank { position: absolute; inset: 0;
    background:
      linear-gradient(#f8f9fa, #f8f9fa) 0 0 / 100% 21px no-repeat,
      linear-gradient(#f8f9fa, #f8f9fa) 0 0 / 46px 100% no-repeat,
      repeating-linear-gradient(90deg, transparent 0 145px, #e2e3e3 145px 146px) 46px 0,
      repeating-linear-gradient(0deg, transparent 0 20px, #e2e3e3 20px 21px) 0 0; }
  #dashboard { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; background: #fff;
    visibility: hidden; }
  #dashboard.in { visibility: visible; }
  /* Darkens the sheet and the tab strip while the camera frames the sidebar, so the edge of the
     shot shows no strip of the tab beside or under the panel. */
  .sheet::after, .tabs::after { content: ''; position: absolute; inset: 0; z-index: 3;
    background: var(--ground); opacity: 0; pointer-events: none; transition: opacity .6s ease; }
  .app.shaded .sheet::after, .app.shaded .tabs::after { opacity: 1; }
  .dock { border-left: 1px solid var(--line); background: #f7f8fc; display: grid;
    grid-template-rows: 38px 1fr; min-width: 0; overflow: hidden; }
  .dock-head { display: flex; align-items: center; gap: 8px; padding: 0 14px; background: #fff;
    border-bottom: 1px solid var(--line); font-size: 13px; color: var(--muted); white-space: nowrap; }
  .dock-head b { color: var(--ink); font-weight: 600; }
  .dock-head .x { margin-left: auto; font-size: 17px; }
  #sidebar { width: 100%; height: 100%; border: 0; display: block; background: #fff; }

  .tabs { position: relative; display: flex; align-items: center; gap: 2px; padding: 0 14px; background: var(--chrome);
    border-top: 1px solid var(--line); font-size: 13px; color: var(--muted); white-space: nowrap;
    overflow: hidden; }
  .tabs .plus { font-size: 18px; padding: 0 12px; }
  .tab { padding: 8px 14px; border-radius: 4px 4px 0 0; }
  .tab.on { color: #0b57d0; font-weight: 600; background: #e8f0fe; box-shadow: inset 0 -3px 0 #0b57d0; }
  .tab.fresh { animation: pop .6s ease; }
  @keyframes pop { from { transform: scale(.85); opacity: 0; } to { transform: none; opacity: 1; } }

  /* Pointer: a soft ring the director moves to what it clicks ------------- */
  #pointer { position: absolute; left: 0; top: 0; width: 34px; height: 34px; margin: -17px 0 0 -17px;
    border-radius: 50%; background: rgba(81, 70, 214, .22); border: 2px solid rgba(81, 70, 214, .85);
    opacity: 0; pointer-events: none; z-index: 50;
    transition: left .7s cubic-bezier(.65, 0, .35, 1), top .7s cubic-bezier(.65, 0, .35, 1), opacity .3s; }
  #pointer.on { opacity: 1; }
  #pointer.press { animation: press .35s ease; }
  @keyframes press { 50% { transform: scale(.7); background: rgba(81, 70, 214, .5); } }

  /* Above the camera: captions and cards ---------------------------------- */
  #caption { position: absolute; left: 50%; bottom: var(--caption-bottom, 6%); z-index: 90;
    transform: translate(-50%, 12px); max-width: 88%; width: max-content;
    background: rgba(12, 12, 20, .92); color: #fff; border-radius: 16px;
    padding: .55em .9em; font-size: var(--caption-size, 34px); font-weight: 700; line-height: 1.22;
    letter-spacing: -.015em; text-align: center; text-wrap: balance; opacity: 0;
    transition: opacity .35s ease, transform .35s ease;
    box-shadow: 0 18px 50px -12px rgba(0, 0, 0, .7), 0 0 0 1px rgba(255, 255, 255, .08); }
  #caption.on { opacity: 1; transform: translate(-50%, 0); }
  #caption em { font-style: normal; color: #b9b2ff; }

  #card { position: absolute; inset: 0; z-index: 100; background: #000; color: #fff;
    display: grid; place-items: center; text-align: center; opacity: 0; pointer-events: none;
    transition: opacity .5s ease; }
  #card.on { opacity: 1; }
  #card .inner { display: grid; justify-items: center; gap: calc(var(--u) * 2.2); padding: 7%;
    max-width: 100%; transition: opacity .3s ease; }
  #card .inner.out { opacity: 0; }
  #card .logo { width: calc(var(--u) * 13); height: calc(var(--u) * 13); }
  #card .logo svg { width: 100%; height: 100%; display: block; }
  #card .kicker { font-size: calc(var(--u) * 1.65); letter-spacing: .24em; text-transform: uppercase;
    color: #8f8fb0; font-weight: 700; margin: 0; }
  #card h1 { margin: 0; font-size: calc(var(--u) * 6.4); font-weight: 800; letter-spacing: -.04em;
    line-height: 1.04; max-width: 15ch; text-wrap: balance; }
  #card .text { margin: 0; font-size: calc(var(--u) * 2.5); color: #b4b4cc; max-width: 30ch;
    line-height: 1.4; text-wrap: balance; }
  #card .note { margin: calc(var(--u) * .6) 0 0; font-size: calc(var(--u) * 1.6); letter-spacing: .12em;
    text-transform: uppercase; color: #77779a; font-weight: 600; }
  #card [hidden] { display: none; }

  /* Chrome only sends a screencast frame when something repaints, so a caption swapped during a
     still shot would not reach the video until the next move. One invisible pixel that repaints
     every frame keeps the capture continuous. */
  #tick { position: absolute; left: 0; bottom: 0; width: 1px; height: 1px; z-index: 1;
    animation: tick 1s steps(30) infinite; }
  @keyframes tick { from { background: #0b0b12; } to { background: #0b0b13; } }
  #card.small h1 { font-size: calc(var(--u) * 5); }
</style>
</head>
<body>
<div id="camera">
  <div class="app">
    <div class="titlebar">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path fill="#0f9d58" d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8l-6-6Z"/>
        <path fill="#87ceac" d="M14 2v6h6l-6-6Z"/>
        <path fill="#fff" d="M8 12h8v6H8v-6Zm1 1.4v1.3h2.4v-1.3H9Zm3.6 0v1.3H15v-1.3h-2.4ZM9 15.9v1.3h2.4v-1.3H9Zm3.6 0v1.3H15v-1.3h-2.4Z"/>
      </svg>
      <div class="doc">
        <strong id="doc-title">Marketing performance</strong>
        <div class="menu"><span>File</span><span>Edit</span><span>View</span><span>Insert</span>
          <span>Format</span><span>Data</span><span>Tools</span><span class="on">Extensions</span><span>Help</span></div>
      </div>
      <div class="right"><span class="share">Share</span><span class="avatar"></span></div>
    </div>
    <div class="toolbar"><span>&#8617;</span><span>&#8618;</span><i></i><span>100%</span><i></i>
      <span>$</span><span>%</span><span>.0</span><i></i><span>Arial</span><i></i><span><b>B</b></span><span><em>I</em></span></div>
    <div class="fbar" id="fbar"><span class="name" id="fbar-name">A1</span><span class="fx">fx</span><span class="value" id="fbar-value"></span></div>
    <div class="body" id="body">
      <div class="sheet" id="sheet"><div class="blank"></div><iframe id="dashboard" title="Dashboard"></iframe></div>
      <div class="dock">
        <div class="dock-head"><b>DataMoov</b><span>Chat with your data</span><span class="x">&times;</span></div>
        <iframe id="sidebar" title="DataMoov sidebar"></iframe>
      </div>
    </div>
    <div class="tabs" id="tabs"><span class="plus">+</span></div>
  </div>
  <div id="pointer"></div>
</div>

<div id="tick"></div>
<div id="caption"></div>
<div id="card"><div class="inner">
  <div class="logo" id="card-logo"></div>
  <p class="kicker" id="card-kicker"></p>
  <h1 id="card-title"></h1>
  <p class="text" id="card-text"></p>
  <p class="note" id="card-note"></p>
</div></div>

<script>
(function () {
  var WORLD = { w: 1600, h: 1000 };
  var camera = document.getElementById('camera');
  var tabs = document.getElementById('tabs');
  var wait = function (ms) { return new Promise(function (r) { setTimeout(r, ms); }); };
  var view = { cx: WORLD.w / 2, cy: WORLD.h / 2, scale: 1 };
  // Camera speed curves: ease in and out (the default), or a move that starts or ends at speed.
  var EASES = { inOut: bezier(.65, 0, .35, 1), out: bezier(.22, 1, .36, 1),
    in: bezier(.55, 0, 1, .45), linear: function (t) { return t; } };
  // The most camera time one frame may cover: a frame Chrome paints late holds the shot, and the
  // move carries on from there, instead of jumping ahead in one frame.
  var MAX_STEP = 50;
  var shot = 0;

  // A CSS cubic-bezier timing function: progress at time t, both from 0 to 1.
  function bezier(x1, y1, x2, y2) {
    var at = function (a, b, t) { return 3 * a * t * (1 - t) * (1 - t) + 3 * b * t * t * (1 - t) + t * t * t; };
    return function (x) {
      var low = 0, high = 1, t = x;
      for (var i = 0; i < 30; i++) {
        t = (low + high) / 2;
        if (at(x1, x2, t) < x) low = t; else high = t;
      }
      return at(y1, y2, t);
    };
  }

  // Steps the camera frame by frame on the page's own clock: `frame(t)` sets the view for
  // progress t (0 to 1). Unlike a CSS transition, which Chrome runs apart from the page (and draws
  // a zoom of at a lower resolution), the view is always what the screen shows, so a move starts
  // from wherever the last one, or a drift, left the camera. A new move takes over from one still
  // running.
  function film(ms, frame) {
    var id = ++shot, elapsed = 0, last = performance.now();
    return new Promise(function (done) {
      (function step(now) {
        if (id !== shot) return done();
        elapsed += Math.max(0, Math.min(MAX_STEP, now - last));
        last = now;
        var t = ms > 0 ? Math.min(1, elapsed / ms) : 1;
        frame(t);
        apply();
        if (t < 1) requestAnimationFrame(step);
        else done();
      })(last);
    });
  }

  // One frame unit for cards, so a square and a landscape frame keep the same proportions.
  function sizeUnits() {
    var u = Math.min(window.innerWidth, window.innerHeight) / 100;
    document.documentElement.style.setProperty('--u', u + 'px');
  }
  sizeUnits();

  function apply() {
    var W = window.innerWidth, H = window.innerHeight;
    var x = W / 2 - view.cx * view.scale, y = H / 2 - view.cy * view.scale;
    camera.style.transform = 'translate(' + x + 'px,' + y + 'px) scale(' + view.scale + ')';
  }

  // Sheets draws empty rows and columns to the edges of the window, but a rendered tab stops a few
  // rows past its data, so the stage adds the empty ones: columns always, rows when every row is
  // drawn (no "more rows" note), up to the tab's last row when the page names it
  // (<meta name="rows" content="1001">). The gridlines then move out from under the cells, so a
  // wipe brings the cells in over the tab's own grid: one grid on screen, never two.
  function fillGrid(doc) {
    var page = doc.querySelector('.page'), cells = doc.querySelector('.grid');
    var heads = Array.prototype.slice.call(doc.querySelectorAll('.head'));
    var columns = heads.filter(function (head) { return !head.id; });
    var rows = heads.filter(function (head) { return head.id; });
    var limit = doc.querySelector('meta[name="rows"]');
    var lastRow = doc.querySelector('.more') ? rows.length : limit ? Number(limit.content) : Infinity;
    var corner = { w: rows[0].offsetWidth, h: columns[0].offsetHeight };
    var right = page.offsetWidth, bottom = page.offsetHeight;
    var add = function (label, id, box) {
      var head = doc.createElement('div');
      head.className = 'head';
      if (id) head.id = id;
      head.style.cssText = 'left:' + box[0] + 'px;top:' + box[1] + 'px;width:' + box[2] + 'px;height:' + box[3] + 'px';
      head.textContent = label;
      page.appendChild(head);
      (id ? rows : columns).push(head);
    };
    // No sheet area is larger than the world.
    for (; right < WORLD.w; right += 100) add(columnName(columns.length), '', [right, 0, 100, corner.h]);
    for (var r = rows.length; bottom < WORLD.h && r < lastRow; bottom += 21, r++)
      add(String(r + 1), 'row-' + (r + 1), [0, bottom, corner.w, 21]);
    var w = right - corner.w, h = bottom - corner.h;
    page.style.width = right + 'px';
    page.style.height = bottom + 'px';
    cells.style.width = w + 'px';
    cells.style.height = h + 'px';
    var freeze = doc.querySelector('.freeze');
    if (freeze) freeze.style.width = w + 'px';
    var lines = doc.querySelector('.lines');
    if (!lines) return;
    page.insertBefore(lines, cells);
    lines.style.left = corner.w + 'px';
    lines.style.top = corner.h + 'px';
    lines.setAttribute('width', w);
    lines.setAttribute('height', h);
    lines.querySelector('path').setAttribute('d', columns.map(function (head) {
      return 'M' + (head.offsetLeft + head.offsetWidth - corner.w - 0.5) + ' 0V' + h;
    }).concat(rows.map(function (head) {
      return 'M0 ' + (head.offsetTop + head.offsetHeight - corner.h - 0.5) + 'H' + w;
    })).join(''));
  }

  // A column's letters, 0 being A, as Sheets names them.
  function columnName(index) {
    var name = '';
    for (var n = index + 1; n > 0; n = Math.floor((n - 1) / 26))
      name = String.fromCharCode(65 + (n - 1) % 26) + name;
    return name;
  }

  // A cell or range of the rendered tab ('B4', 'A3:D4'): its box in world pixels, from its
  // column and row headers, and the two headers Sheets highlights for it.
  function cellArea(ref) {
    var doc = document.getElementById('dashboard').contentDocument;
    var parts = ref.split(':').map(function (a1) {
      var m = /^([A-Z]+)(\d+)$/.exec(a1);
      var column = Array.prototype.find.call(doc.querySelectorAll('.head'), function (head) {
        return !head.id && head.textContent === m[1];
      });
      var row = doc.getElementById('row-' + m[2]);
      if (!column || !row) throw new Error('No cell ' + a1 + ' in the rendered tab');
      var c = column.getBoundingClientRect(), r = row.getBoundingClientRect();
      return { left: c.left, right: c.right, top: r.top, bottom: r.bottom, column: column, row: row };
    });
    var a = parts[0], b = parts[parts.length - 1];
    var sheet = stage.rect('sheet');
    return { x: sheet.x + a.left, y: sheet.y + a.top, w: b.right - a.left, h: b.bottom - a.top,
      heads: [a.column, a.row] };
  }

  var stage = {
    ready: true,
    world: WORLD,
    // Fits a world rectangle into the frame, leaving `reserve` (a fraction of the frame height)
    // free at the bottom for captions. The frame's offset and scale each follow the speed curve,
    // as a CSS transform transition would move them.
    async look(rect, ms, reserve, ease) {
      var W = window.innerWidth, H = window.innerHeight;
      var free = H * (1 - (reserve || 0));
      var scale = Math.min(W / rect.w, free / rect.h);
      var to = { cx: rect.x + rect.w / 2, cy: rect.y + rect.h / 2 + (H - free) / 2 / scale, scale: scale };
      var offset = function (v) { return { x: W / 2 - v.cx * v.scale, y: H / 2 - v.cy * v.scale, s: v.scale }; };
      var a = offset(view), b = offset(to), curve = EASES[ease || 'inOut'];
      await film(ms, function (t) {
        var e = curve(t), s = a.s + (b.s - a.s) * e;
        view = { cx: (W / 2 - a.x - (b.x - a.x) * e) / s, cy: (H / 2 - a.y - (b.y - a.y) * e) / s, scale: s };
      });
    },
    // A slow push in (`zoom` > 1) or pull out around the current centre, so a hold keeps moving.
    async drift(ms, zoom) {
      var from = view.scale;
      await film(ms, function (t) { view.scale = from * (1 + (zoom - 1) * t); });
    },
    sidebar(url) { document.getElementById('sidebar').src = url; },
    async dashboard(url) {
      var frame = document.getElementById('dashboard');
      await new Promise(function (resolve) { frame.onload = resolve; frame.src = url; });
      // The rendered tab draws its own tab strip; the stage has one already.
      var style = frame.contentDocument.createElement('style');
      style.textContent = '.tabs, .more { display: none !important; } html { scrollbar-width: none; }';
      frame.contentDocument.head.appendChild(style);
      fillGrid(frame.contentDocument);
    },
    // Shows the rendered tab and wipes its cells in over its own grid, top to bottom of what the
    // frame shows; or (`show` false) wipes them out again and leaves the empty sheet.
    async reveal(ms, show) {
      ms = ms || 1100;
      var frame = document.getElementById('dashboard'), win = frame.contentWindow;
      var cells = frame.contentDocument.querySelector('.grid');
      frame.classList.add('in');
      var top = win.scrollY - cells.offsetTop, bottom = top + win.innerHeight;
      var edge = function (y) { return 'inset(0 0 calc(100% - ' + Math.max(0, y) + 'px) 0)'; };
      var wipe = cells.animate({ clipPath: show === false ? [edge(bottom), edge(top)] : [edge(top), edge(bottom)] },
        { duration: ms, easing: 'cubic-bezier(.65, 0, .35, 1)', fill: 'forwards' });
      await wipe.finished;
      if (show === false) frame.classList.remove('in');
      else wipe.cancel();
    },
    shade(on) { document.querySelector('.app').classList.toggle('shaded', Boolean(on)); },
    async dock(open, ms) {
      document.getElementById('body').classList.toggle('closed', !open);
      await wait(ms || 900);
    },
    // Where the cell holding a section title sits in the dashboard frame, at the current scroll.
    sectionTop(title) {
      var doc = document.getElementById('dashboard').contentDocument;
      // The last match: the navigation row at the top repeats the section titles as links.
      var nodes = doc.querySelectorAll('.text');
      for (var i = nodes.length - 1; i >= 0; i--)
        if (nodes[i].textContent.trim() === title) return nodes[i].getBoundingClientRect().top;
      throw new Error('No dashboard section titled ' + title);
    },
    async scrollDashboard(title, offset, ms) {
      var win = document.getElementById('dashboard').contentWindow;
      var from = win.scrollY;
      var to = Math.max(0, from + stage.sectionTop(title) - (offset || 0));
      var start = performance.now();
      ms = ms || 1200;
      await new Promise(function (resolve) {
        (function step(now) {
          var t = Math.min(1, (now - start) / ms);
          var e = t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
          win.scrollTo(0, from + (to - from) * e);
          if (t < 1) requestAnimationFrame(step); else resolve();
        })(start);
      });
    },
    // The world rectangle of the sheet area and of the dock, as laid out now.
    rect(id) {
      var node = document.getElementById(id);
      var box = node.getBoundingClientRect(), cam = camera.getBoundingClientRect();
      return { x: (box.left - cam.left) / view.scale, y: (box.top - cam.top) / view.scale,
        w: box.width / view.scale, h: box.height / view.scale };
    },
    toWorld(x, y) {
      var cam = camera.getBoundingClientRect();
      return { x: (x - cam.left) / view.scale, y: (y - cam.top) / view.scale };
    },
    async point(x, y, press) {
      var p = document.getElementById('pointer');
      p.classList.add('on');
      p.style.left = x + 'px';
      p.style.top = y + 'px';
      await wait(720);
      if (press) {
        p.classList.remove('press');
        void p.offsetWidth;
        p.classList.add('press');
        await wait(360);
      }
    },
    hidePointer() { document.getElementById('pointer').classList.remove('on'); },
    setTabs(names, active) {
      tabs.replaceChildren();
      names.forEach(function (name) { stage.addTab(name, name === active, true); });
    },
    addTab(name, active, quiet) {
      var tab = document.createElement('span');
      tab.className = 'tab' + (quiet ? '' : ' fresh');
      tab.textContent = name;
      tab.dataset.name = name;
      tabs.appendChild(tab);
      if (active) stage.activate(name);
    },
    activate(name) {
      Array.prototype.forEach.call(tabs.querySelectorAll('.tab'), function (tab) {
        tab.classList.toggle('on', tab.dataset.name === name);
      });
    },
    title(text) { document.getElementById('doc-title').textContent = text; },
    // The rendered tab's box for a cell or range ('B4', 'A3:D4'), in world pixels.
    cellBox(ref) {
      var area = cellArea(ref);
      return { x: area.x, y: area.y, w: area.w, h: area.h };
    },
    // Selects a cell of the rendered tab, as Sheets draws it, and shows its content in the
    // formula bar.
    select(ref, content) {
      var doc = document.getElementById('dashboard').contentDocument;
      var box = cellArea(ref);
      var sheet = stage.rect('sheet');
      var page = doc.querySelector('.page');
      var mark = doc.getElementById('selection');
      if (!mark) {
        mark = doc.createElement('div');
        mark.id = 'selection';
        mark.style.cssText = 'position:absolute;z-index:5;border:2px solid #1a73e8;' +
          'background:rgba(26,115,232,.08);box-sizing:border-box;pointer-events:none';
        page.appendChild(mark);
      }
      var origin = page.getBoundingClientRect();
      mark.style.left = box.x - sheet.x - origin.left + 'px';
      mark.style.top = box.y - sheet.y - origin.top + 'px';
      mark.style.width = box.w + 'px';
      mark.style.height = box.h + 'px';
      Array.prototype.forEach.call(doc.querySelectorAll('.head'), function (head) {
        var on = box.heads.indexOf(head) >= 0;
        head.style.background = on ? '#d3e3fd' : '';
        head.style.color = on ? '#0b57d0' : '';
      });
      stage.formula(ref.split(':')[0], content);
    },
    // The formula bar: a cell name and its content, references and functions coloured as in Sheets.
    formula(name, content) {
      document.getElementById('fbar-name').textContent = name || '';
      var text = String(content == null ? '' : content);
      var html = text.replace(/[&<>]/g, function (ch) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;' }[ch];
      });
      if (text.charAt(0) === '=')
        html = html
          .replace(/([A-Za-z][A-Za-z0-9]*![A-Z]+\d*(?::[A-Z]+\d*)?)/g, '<span class="ref">$1</span>')
          .replace(/([A-Z][A-Z.]+)(?=\()/g, '<span class="fn">$1</span>');
      document.getElementById('fbar-value').innerHTML = html;
    },
    // Wraps the formula bar's text at `px` world pixels (null: the bar's full width), so a long
    // formula reads in a few lines a close-up can frame whole, as an expanded bar shows it.
    wrapFormula(px) {
      document.getElementById('fbar-value').style.maxWidth = px ? px + 'px' : '';
    },
    say(html) {
      var node = document.getElementById('caption');
      if (html) node.innerHTML = html;
      node.classList.toggle('on', Boolean(html));
    },
    // A card shown over a card stays on black: its words fade out and the new ones in.
    async card(options) {
      var node = document.getElementById('card');
      var words = node.querySelector('.inner');
      if (options.show === false) { node.classList.remove('on'); return; }
      if (node.classList.contains('on')) {
        words.classList.add('out');
        await wait(300);
      }
      var set = function (id, text) {
        var el = document.getElementById(id);
        el.textContent = text || '';
        el.hidden = !text;
      };
      set('card-kicker', options.kicker);
      set('card-title', options.title);
      set('card-text', options.text);
      set('card-note', options.note);
      document.getElementById('card-logo').innerHTML = options.logo === false ? '' : stage.logo;
      document.getElementById('card-logo').hidden = options.logo === false;
      node.classList.toggle('small', (options.title || '').length > 42);
      node.classList.add('on');
      words.classList.remove('out');
    },
    logo: '',
  };
  window.addEventListener('resize', function () { sizeUnits(); apply(); });
  stage.setTabs(['Sheet1'], 'Sheet1');
  window.stage = stage;
})();
</script>
</body>
</html>
