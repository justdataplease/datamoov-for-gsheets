<script>
  (function () {
    'use strict';
    const $ = (id) => document.getElementById(id);
    const state = {
      catalog: [],
      connections: [],
      credentials: [],
      families: [],
      credentialId: null,
      reports: [],
      dashboards: [],
      limits: { maxRows: 30000, defaultRows: 10000 },
      reportId: null,
      connectionId: null,
      connectionReturnTo: 'connections',
      accountEpoch: 0,
      accountChoices: [],
      columns: [],
      activeTab: 'reports',
      loaded: false,
    };
    const api = (name, ...args) =>
      new Promise((resolve, reject) => {
        if (!window.google || !google.script || !google.script.run) {
          reject(new Error('Open DataMoov from your spreadsheet to connect to Google services.'));
          return;
        }
        google.script.run
          .withSuccessHandler(resolve)
          .withFailureHandler((error) =>
            reject(new Error((error && error.message) || 'The request could not be completed.'))
          )
          [name](...args);
      });
    const el = (tag, className, text) => {
      const node = document.createElement(tag);
      if (className) node.className = className;
      if (text !== undefined) node.textContent = String(text);
      return node;
    };
    const button = (label, className, handler) => {
      const node = el('button', className, label);
      node.type = 'button';
      node.addEventListener('click', handler);
      return node;
    };
    const SVG_NS = 'http://www.w3.org/2000/svg';
    const provider = (id) => state.catalog.find((item) => item.id === id);
    const currentProvider = () => provider($('report-provider').value);
    const currentReport = () =>
      (currentProvider()?.reports || []).find((item) => item.id === $('report-type').value);
    const option = (value, label) => {
      const node = el('option', '', label);
      node.value = value;
      return node;
    };
    const defaultValue = (field) => (field.default == null ? '' : field.default);
    const fieldKey = (field) => field.key || field.name;
    function notice(message, kind = 'success') {
      $('notice').textContent = message;
      $('notice').className = 'notice ' + kind;
      $('notice').setAttribute('role', kind === 'error' ? 'alert' : 'status');
      $('notice').hidden = !message;
      if (message && kind === 'error')
        $('notice').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }
    const TABS = ['reports', 'chat', 'connections', 'settings'];
    // Editors are screens inside a tab, not tabs of their own.
    const SCREENS = { compose: 'reports', connect: 'connections' };
    const PANELS = TABS.concat(Object.keys(SCREENS));
    const family = (id) => state.families.find((item) => item.id === id);
    const familyFor = (source) => (source ? family(source.credentialFamily) : undefined);
    const credentialFields = (source) =>
      (source?.authFields || []).filter((field) => !field.perConnection);
    const connectionFields = (source) =>
      (source?.authFields || []).filter((field) => field.perConnection);
    const usedBy = (credentialId) =>
      state.connections.filter((item) => item.credentialId === credentialId).length;
    function tab(name) {
      const selected = SCREENS[name] || name;
      state.activeTab = selected;
      for (const item of PANELS) $('panel-' + item).hidden = item !== name;
      for (const item of TABS) {
        $('tab-' + item).setAttribute('aria-selected', String(item === selected));
        $('tab-' + item).tabIndex = item === selected ? 0 : -1;
      }
    }
    async function busy(node, label, work) {
      const previous = node.textContent;
      const icon = node.classList.contains('icon-button');
      node.disabled = true;
      if (!icon) node.textContent = label;
      node.setAttribute('aria-busy', 'true');
      try {
        return await work();
      } catch (error) {
        notice(error.message || 'Something went wrong. Please try again.', 'error');
        return null;
      } finally {
        node.disabled = false;
        if (!icon && node.textContent === label) node.textContent = previous;
        node.removeAttribute('aria-busy');
      }
    }
    async function formBusy(formId, submitId, label, work) {
      const fieldset = $(formId);
      return busy($(submitId), label, async () => {
        fieldset.disabled = true;
        try {
          return await work();
        } finally {
          fieldset.disabled = false;
        }
      });
    }
    function upsert(items, item) {
      const index = items.findIndex((existing) => existing.id === item.id);
      if (index < 0) items.push(item);
      else items[index] = item;
    }
    function upsertReport(report) {
      const index = state.reports.findIndex((item) => item.id === report.id);
      if (index < 0) state.reports.push(report);
      else state.reports[index] = report;
    }
    function fillProviders(select, selected) {
      select.replaceChildren();
      for (const source of state.catalog) select.append(option(source.id, source.label));
      if (selected && provider(selected)) select.value = selected;
      paintSourceBadge(select);
    }
    function refreshConnections(selected) {
      const dropdown = $('report-connection');
      const previous = selected || dropdown.value;
      const connections = state.connections.filter(
        (item) => item.connectorId === $('report-provider').value
      );
      dropdown.replaceChildren();
      if (!connections.length) dropdown.append(option('', 'Connect an account first'));
      connections.forEach((item) => dropdown.append(option(item.id, item.label)));
      if (connections.some((item) => item.id === previous)) dropdown.value = previous;
      $('connection-empty').hidden = connections.length > 0;
    }
    // Brand marks reach the browser as validated path geometry, never as markup: every path is
    // built with createElementNS, so nothing a connector declares is ever parsed as HTML.
    function providerIcon(source) {
      const icon = source?.icon;
      const shapes = Array.isArray(icon?.shapes) ? icon.shapes : [];
      const svg = document.createElementNS(SVG_NS, 'svg');
      svg.setAttribute(
        'viewBox',
        /^-?[\d.]+ -?[\d.]+ [\d.]+ [\d.]+$/.test(icon?.viewBox || '') ? icon.viewBox : '0 0 24 24'
      );
      svg.setAttribute('aria-hidden', 'true');
      svg.setAttribute('focusable', 'false');
      for (const shape of shapes) {
        if (!/^[MmLlHhVvCcSsQqTtAaZz0-9eE ,.+-]+$/.test(shape?.d || '')) continue;
        if (!/^#[0-9a-f]{6}$/i.test(shape?.fill || '')) continue;
        const path = document.createElementNS(SVG_NS, 'path');
        path.setAttribute('d', shape.d);
        path.setAttribute('fill', shape.fill);
        if (shape.rule === 'evenodd') path.setAttribute('fill-rule', 'evenodd');
        if (shape.opacity > 0 && shape.opacity < 1)
          path.setAttribute('opacity', String(shape.opacity));
        svg.append(path);
      }
      return svg.childElementCount ? svg : null;
    }
    // A source that declares no mark keeps the initials badge tinted with its brand colour.
    function fillBadge(node, source) {
      const icon = providerIcon(source);
      node.replaceChildren();
      node.style.color = '';
      node.style.backgroundColor = '';
      node.classList.toggle('has-icon', Boolean(icon));
      node.title = source?.label || '';
      if (icon) {
        node.append(icon);
        return node;
      }
      node.textContent = (source?.label || '?')
        .split(/\s+/)
        .map((word) => word[0])
        .slice(0, 2)
        .join('');
      if (/^#[a-f\d]{6}$/i.test(source?.color || '')) {
        node.style.color = source.color;
        node.style.backgroundColor = source.color + '12';
      }
      return node;
    }
    function providerBadge(source) {
      const badge = el('span', 'provider-badge');
      badge.setAttribute('aria-hidden', 'true');
      return fillBadge(badge, source);
    }
    // The source dropdowns stay native selects, so the chosen source's mark sits inside the control.
    function paintSourceBadge(select) {
      const node = $(select.id + '-badge');
      if (node) fillBadge(node, provider(select.value));
    }
    function empty(title, description, icon = '▦') {
      const node = el('div', 'empty-state');
      node.append(
        el('span', 'empty-icon', icon),
        el('strong', '', title),
        el('p', '', description)
      );
      return node;
    }
    function detail(label, value) {
      const row = el('div', 'card-detail');
      row.append(el('span', '', label), el('strong', '', value));
      return row;
    }
    function timeLabel(value) {
      if (!value) return 'Not run yet';
      const date = new Date(value);
      if (!Number.isFinite(date.getTime())) return 'Last run recorded';
      return date.toLocaleString(undefined, {
        month: 'short',
        day: 'numeric',
        hour: '2-digit',
        minute: '2-digit',
      });
    }
    function continuationMessage(report) {
      return (
        (report.fetchedRowCount || 0).toLocaleString() +
        ' rows fetched. Existing sheet output is unchanged. Resume continues this report; the hourly scheduler also resumes it.'
      );
    }
    // The Reports tab lists saved reports and dashboards, so its counter covers both.
    function renderTabCount() {
      $('report-count').textContent = String(state.reports.length + state.dashboards.length);
    }
    function renderReports() {
      renderTabCount();
      const list = $('reports-list');
      list.replaceChildren();
      if (!state.reports.length)
        list.append(
          empty(
            'Your first report starts here',
            'Connect a data source and bring the numbers you care about into Sheets.'
          )
        );
      for (const report of state.reports) {
        const source = provider(report.connectorId);
        const card = el('article', 'report-card');
        const content = el('div', 'card-content');
        const top = el('div', 'card-top');
        const names = el('div');
        names.append(
          el('div', 'card-title', report.name),
          el('div', 'card-subtitle', source?.label || report.connectorId)
        );
        const failed = Boolean(report.lastError) || ['failed', 'error'].includes(report.status);
        const running = ['running', 'started'].includes(report.status);
        const paused = report.status === 'paused';
        const status = failed
          ? ['Needs attention', 'error']
          : running
            ? ['Running', 'running']
            : paused
              ? ['Paused', 'paused']
              : report.lastRun
                ? ['Up to date', 'success']
                : ['Ready', ''];
        top.append(providerBadge(source), names, el('span', 'status ' + status[1], status[0]));
        content.append(
          top,
          detail(
            '↳',
            (report.target?.sheetName || '') + ' · ' + (report.target?.startCell || 'A1')
          ),
          detail(
            'Refresh',
            { manual: 'On demand', hourly: 'Every hour', daily: 'Daily', weekly: 'Weekly' }[
              report.schedule
            ] ||
              report.schedule ||
              'On demand'
          ),
          detail(
            'Updated',
            timeLabel(report.lastRun) +
              (report.lastRowCount != null
                ? ' · ' + report.lastRowCount.toLocaleString() + ' rows'
                : '')
          )
        );
        if (paused) content.append(el('p', 'card-progress', continuationMessage(report)));
        if (report.lastError) content.append(el('p', 'card-error', report.lastError));
        const actions = el('div', 'card-bottom');
        actions.append(
          button('Edit', 'text-button subtle', () => editReport(report)),
          button('Remove', 'text-button subtle', (event) =>
            busy(event.currentTarget, 'Removing…', async () => {
              if (
                !window.confirm('Remove "' + report.name + '"? Existing sheet data stays in place.')
              )
                return;
              await api('dmvDeleteReport', report.id);
              state.reports = state.reports.filter((item) => item.id !== report.id);
              renderReports();
              if (state.reportId === report.id) resetReport();
              notice('Report removed. Existing sheet data was kept.');
            })
          ),
          button(paused ? '▶ Resume' : '▶ Run', 'run-button', (event) =>
            busy(event.currentTarget, paused ? 'Resuming…' : 'Running…', async () => {
              notice((paused ? 'Resuming ' : 'Refreshing ') + report.name + '…', 'info');
              try {
                const result = await api('dmvRunReport', report.id);
                if (result.pending) {
                  report.fetchedRowCount = result.rowCount;
                  report.lastError = null;
                  report.status = 'paused';
                  renderReports();
                  notice(continuationMessage(report), 'info');
                  return;
                }
                report.lastRun = result.updatedAt || new Date().toISOString();
                report.lastRowCount = result.rowCount;
                report.lastError = null;
                report.status = 'success';
                delete report.fetchedRowCount;
                renderReports();
                notice(
                  (result.rowCount || 0).toLocaleString() +
                    ' rows updated in ' +
                    report.target.sheetName +
                    '.' +
                    (result.warning ? ' ' + result.warning : ''),
                  result.warning ? 'info' : 'success'
                );
              } catch (error) {
                report.status = 'failed';
                report.lastError = error.message;
                renderReports();
                throw error;
              }
            })
          )
        );
        const run = actions.querySelector('.run-button');
        run.disabled = running;
        card.append(content, actions);
        list.append(card);
      }
    }
    const dashboardView = {
      epoch: 0,
      fetch: null,
      timer: null,
      disposed: false,
      runs: new Map(),
      removals: new Map(),
    };
    function dashboardRunning(dashboard) {
      return (
        dashboardView.runs.has(dashboard.id) ||
        ['running', 'started', 'pending'].includes(dashboard.status)
      );
    }
    function resetDashboards() {
      dashboardView.epoch++;
      window.clearTimeout(dashboardView.timer);
      dashboardView.runs.clear();
      dashboardView.removals.clear();
    }
    function scheduleDashboardPoll() {
      window.clearTimeout(dashboardView.timer);
      if (dashboardView.disposed || !state.dashboards.some(dashboardRunning)) return;
      dashboardView.timer = window.setTimeout(() => {
        refreshDashboards().catch(() => {
          // A missed progress update does not interrupt the refresh itself.
          scheduleDashboardPoll();
        });
      }, 2000);
    }
    async function refreshDashboards() {
      if (dashboardView.disposed) return;
      if (dashboardView.fetch) {
        const previous = dashboardView.fetch;
        if (previous.epoch === dashboardView.epoch) return previous.promise;
        try {
          await previous.promise;
        } catch {
          /* Fetch current state after the old request ends. */
        }
        return refreshDashboards();
      }
      const request = { epoch: dashboardView.epoch, promise: null };
      dashboardView.fetch = request;
      request.promise = api('dmvListDashboards')
        .then((items) => {
          if (dashboardView.disposed || request.epoch !== dashboardView.epoch) return;
          if (!Array.isArray(items)) throw new Error('Dashboard status could not be read.');
          state.dashboards = items.map((item) => {
            if (
              !dashboardView.runs.has(item.id) ||
              ['running', 'started', 'pending'].includes(item.status)
            )
              return item;
            const previous = state.dashboards.find((saved) => saved.id === item.id);
            return {
              ...item,
              status: 'running',
              lastError: null,
              statusMessage: previous?.statusMessage || 'Preparing dashboard refresh...',
            };
          });
          renderDashboards();
        })
        .finally(() => {
          if (dashboardView.fetch === request) dashboardView.fetch = null;
          scheduleDashboardPoll();
        });
      return request.promise;
    }
    function sheetLink(label, value) {
      if (typeof value !== 'string') return null;
      try {
        const url = new URL(value);
        if (
          url.origin !== 'https://docs.google.com' ||
          url.username ||
          url.password ||
          url.search ||
          !/^\/spreadsheets\/d\/[A-Za-z0-9_-]+\/edit$/.test(url.pathname) ||
          !/^#gid=\d+(?:&range=[A-Z]+[1-9]\d*(?:(?:%3A|:)[A-Z]+[1-9]\d*)?)?$/.test(url.hash)
        )
          return null;
        const link = el('a', 'sheet-output-link', label);
        link.href = url.href;
        link.target = '_blank';
        link.rel = 'noopener noreferrer';
        return link;
      } catch {
        return null;
      }
    }
    function dashboardDetail(label, target, url) {
      const name = dashboardTarget(target);
      const row = detail(label, name);
      const link = sheetLink(name, url);
      if (link) row.lastElementChild.replaceChildren(link);
      return row;
    }
    function dashboardTarget(target) {
      return typeof target === 'string' ? target : target?.sheetName || 'Not configured';
    }
    function createDashboardInChat() {
      tab('chat');
      const input = $('chat-input');
      if (input.disabled) {
        notice('Wait for the current answer before creating a dashboard.', 'info');
        return;
      }
      input.value =
        'Create a performance dashboard from my connected sources: each dataset in its own tab, plus a Dashboard tab with scorecards and charts. Ask me which sources, metrics and date range to use.';
      input.focus();
    }
    function renderDashboards() {
      renderTabCount();
      const list = $('dashboards-list');
      list.replaceChildren();
      if (!state.dashboards.length) {
        list.append(
          empty(
            'Create your first dashboard in Chat',
            'Choose sources, metrics and dates in one conversation. Your dashboard appears here when saved.'
          )
        );
      }
      for (const dashboard of state.dashboards) {
        const card = el('article', 'report-card dashboard-card');
        card.dataset.dashboardId = dashboard.id;
        const content = el('div', 'card-content');
        const top = el('div', 'card-top');
        const names = el('div');
        const datasets = Array.isArray(dashboard.datasets) ? dashboard.datasets : [];
        const charts = Number(dashboard.chartCount || 0);
        names.append(
          el('div', 'card-title', dashboard.name),
          el(
            'div',
            'card-subtitle',
            datasets.length +
              (datasets.length === 1 ? ' dataset · ' : ' datasets · ') +
              charts +
              (charts === 1 ? ' chart' : ' charts')
          )
        );
        const running = dashboardRunning(dashboard);
        const removing = dashboardView.removals.has(dashboard.id);
        const failed =
          Boolean(dashboard.lastError) || ['failed', 'error'].includes(dashboard.status);
        const status = running
          ? ['Refreshing', 'running']
          : failed
            ? ['Needs attention', 'error']
            : dashboard.lastRun
              ? ['Up to date', 'success']
              : ['Ready', ''];
        top.append(names, el('span', 'status ' + status[1], status[0]));
        content.append(
          top,
          dashboardDetail('Dashboard tab', dashboard.target, dashboard.reportUrl)
        );
        // One line per dataset: where its rows land and how many the last refresh wrote.
        for (const dataset of datasets) {
          const row = dashboardDetail(dataset.label, dataset.sheetName, dataset.url);
          if (dataset.rowCount != null)
            row.lastElementChild.append(
              ' · ' + Number(dataset.rowCount).toLocaleString() + ' rows'
            );
          content.append(row);
        }
        content.append(detail('Updated', timeLabel(dashboard.lastRun)));
        if (dashboard.statusMessage)
          content.append(el('p', 'card-progress', dashboard.statusMessage));
        if (dashboard.lastError) content.append(el('p', 'card-error', dashboard.lastError));
        const actions = el('div', 'card-bottom');
        const remove = button(removing ? 'Removing...' : 'Remove', 'text-button subtle', () =>
          removeDashboard(dashboard)
        );
        const refresh = button(running ? 'Refreshing...' : 'Refresh dashboard', 'run-button', () =>
          runDashboard(dashboard)
        );
        remove.disabled = running || removing;
        refresh.disabled = running || removing || dashboard.legacy === true;
        actions.append(remove, refresh);
        card.append(content, actions);
        list.append(card);
      }
    }
    async function runDashboard(dashboard) {
      if (dashboardRunning(dashboard) || dashboardView.removals.has(dashboard.id)) return;
      const token = {};
      dashboardView.epoch++;
      dashboardView.runs.set(dashboard.id, token);
      upsert(state.dashboards, {
        ...dashboard,
        status: 'running',
        lastError: null,
        statusMessage: 'Preparing dashboard refresh...',
      });
      renderDashboards();
      scheduleDashboardPoll();
      notice('Refreshing ' + dashboard.name + '...', 'info');
      try {
        const result = await api('dmvRunDashboard', dashboard.id);
        if (dashboardView.disposed || dashboardView.runs.get(dashboard.id) !== token) return;
        const current = state.dashboards.find((item) => item.id === dashboard.id) || dashboard;
        const refreshed = Array.isArray(result.datasets) ? result.datasets : [];
        upsert(state.dashboards, {
          ...current,
          reportUrl: result.reportUrl || current.reportUrl,
          status: 'success',
          lastError: null,
          statusMessage: '',
          lastRun: result.updatedAt || new Date().toISOString(),
          lastRowCount: result.rowCount,
          chartCount: result.chartCount == null ? current.chartCount : result.chartCount,
          target: result.target || current.target,
          datasets: refreshed.length ? refreshed : current.datasets,
        });
        notice(
          Number(result.rowCount || 0).toLocaleString() +
            ' rows refreshed in ' +
            refreshed.length +
            (refreshed.length === 1 ? ' data tab; ' : ' data tabs; ') +
            Number(result.chartCount || 0) +
            (Number(result.chartCount) === 1 ? ' chart rebuilt on ' : ' charts rebuilt on ') +
            dashboardTarget(result.target || current.target) +
            '.'
        );
      } catch (error) {
        if (dashboardView.disposed || dashboardView.runs.get(dashboard.id) !== token) return;
        const current = state.dashboards.find((item) => item.id === dashboard.id) || dashboard;
        upsert(state.dashboards, {
          ...current,
          status: 'failed',
          statusMessage: '',
          lastError: error.message,
        });
        notice(error.message || 'The dashboard could not be refreshed.', 'error');
      } finally {
        if (dashboardView.runs.get(dashboard.id) === token) {
          dashboardView.runs.delete(dashboard.id);
          dashboardView.epoch++;
          renderDashboards();
          refreshDashboards().catch(() => {
            /* Keep the confirmed result if the list cannot refresh. */
          });
        }
      }
    }
    async function removeDashboard(dashboard) {
      if (dashboardRunning(dashboard) || dashboardView.removals.has(dashboard.id)) return;
      // Removing cleans up: the tabs the dashboard wrote go with it, so name them first.
      const tabs = [dashboardTarget(dashboard.target)].concat(
        (dashboard.datasets || []).map((dataset) => dataset.sheetName)
      );
      if (
        !window.confirm(
          'Remove your dashboard "' +
            dashboard.name +
            '" and delete the tabs it created?\n\n' +
            tabs.join('\n') +
            '\nand its hidden chart data tab.\n\nYour other tabs are not touched.'
        )
      )
        return;
      const token = {};
      dashboardView.epoch++;
      dashboardView.removals.set(dashboard.id, token);
      renderDashboards();
      try {
        const removed = await api('dmvDeleteDashboard', dashboard.id);
        if (dashboardView.disposed || dashboardView.removals.get(dashboard.id) !== token) return;
        state.dashboards = state.dashboards.filter((item) => item.id !== dashboard.id);
        const count = Number(removed?.deletedTabs || 0);
        notice(
          'Dashboard removed' +
            (count ? ' with its ' + count + (count === 1 ? ' tab.' : ' tabs.') : '.')
        );
      } catch (error) {
        if (!dashboardView.disposed && dashboardView.removals.get(dashboard.id) === token)
          notice(error.message || 'The dashboard could not be removed.', 'error');
      } finally {
        if (dashboardView.removals.get(dashboard.id) === token) {
          dashboardView.removals.delete(dashboard.id);
          dashboardView.epoch++;
          renderDashboards();
          scheduleDashboardPoll();
        }
      }
    }
    function renderConnections() {
      const list = $('connections-list');
      list.replaceChildren();
      if (!state.connections.length)
        list.append(
          empty(
            'Bring your accounts together',
            'Add a connection below. You can reuse it across your reports.',
            '⌁'
          )
        );
      for (const connection of state.connections) {
        const source = provider(connection.connectorId);
        const card = el('article', 'connection-card');
        const top = el('div', 'card-top');
        const names = el('div');
        names.append(
          el('div', 'card-title', connection.label),
          el('div', 'card-subtitle', source?.label || connection.connectorId)
        );
        top.append(providerBadge(source), names);
        const content = el('div', 'card-content');
        content.append(top);
        const identity = (source?.accountDiscovery?.credentialKeys || [])
          .map((key) => connection.values?.[key])
          .find(Boolean);
        if (identity) content.append(detail(source.accountDiscovery.label, identity));
        const credential = state.credentials.find((item) => item.id === connection.credentialId);
        content.append(
          detail(
            'Credential',
            credential
              ? credential.label
              : connection.credentialMissing
                ? 'Missing: choose another'
                : 'Stored with this connection'
          )
        );
        const actions = el('div', 'card-bottom');
        actions.append(

      loadConnectionChat(connection.id);
      tab('connect');
      $('connection-label').focus();
    }
    function resetReport(connectorId) {
      state.reportId = null;
      $('report-form').reset();
      $('data-preview').hidden = true;
      $('report-editor-title').textContent = 'Build a report';
      $('save-report').textContent = 'Save report';
      fillProviders($('report-provider'), connectorId);
      $('row-limit').value = state.limits.defaultRows || 1000;
      $('row-limit').max = state.limits.maxRows || 30000;
      $('target-sheet').value = state.target?.sheetName || 'DataMoov report';
      $('target-cell').value = state.target?.startCell || 'A1';
      changeProvider();
      updateDates();
      updateSchedule();
    }
    function changeProvider(selectedType) {
      paintSourceBadge($('report-provider'));
      refreshConnections('');
      $('report-type').replaceChildren();
      const reports = currentProvider()?.reports || [];
      reports.forEach((report) => $('report-type').append(option(report.id, report.label)));
      if (reports.some((report) => report.id === selectedType))
        $('report-type').value = selectedType;
      renderReportFields();
    }
    function renderReportFields(config = {}, selectedFields) {
      const report = currentReport();
      $('data-preview').hidden = true;
      $('report-description').textContent = report?.description || '';
      $('date-section').hidden = !report?.dateRange;
      const configContainer = $('report-config');
      configContainer.replaceChildren();
      for (const field of report?.configFields || [])
        configContainer.append(createField(field, 'config-', config[fieldKey(field)], false));
      updateConditionalFields(configContainer, report?.configFields || []);
      $('discover-fields').hidden = !report?.supportsDiscovery;
      $('column-help').hidden = !report?.supportsDiscovery;
      state.columns = (report?.fields || []).slice();
      // A saved selection is a choice; a fresh list is still on its defaults.
      state.columnsChosen = Boolean(selectedFields);
      for (const key of selectedFields || []) {
        if (!state.columns.some((field) => field.key === key))
          state.columns.push({ key, label: key, type: 'string' });
      }
      renderColumns(selectedFields);
      if (!state.reportId && !$('report-name').value) $('report-name').value = report?.label || '';
      updateDates();
    }
    function selectedColumnKeys() {
      return Array.from($('column-list').querySelectorAll('input:checked')).map(
        (input) => input.value
      );
    }
    function defaultColumnKeys() {
      const marked = state.columns.some((field) => typeof field.default === 'boolean');
      return state.columns
        .filter((field) => (marked ? field.default === true : field.default !== false))
        .map((field) => field.key);
    }
    function renderColumns(selected) {
      const choices = selected || defaultColumnKeys();
      const container = $('column-list');
      container.replaceChildren();
      const roles = ['dimension', 'metric', 'other'];
      for (const role of roles) {
        const fields = state.columns.filter(
          (field) =>
            (field.role || 'other') === role ||
            (role === 'other' && !['dimension', 'metric'].includes(field.role))
        );
        if (!fields.length) continue;
        if (state.columns.some((field) => field.role))
          container.append(
            el(
              'p',
              'column-group',
              role === 'dimension' ? 'Dimensions' : role === 'metric' ? 'Metrics' : 'Other columns'
            )
          );
        for (const field of fields) {
          const label = el('label', 'column-option');
          const input = el('input');
          input.type = 'checkbox';
          input.value = field.key;
          input.checked = choices.includes(field.key);
          label.dataset.search = ((field.label || '') + ' ' + field.key).toLowerCase();
          label.append(
            input,
            el('span', '', field.label || field.key),
            el(
              'span',
              'column-type',
              field.type === 'number' ? '#' : field.type === 'date' ? 'date' : ''
            )
          );
          container.append(label);
        }
      }
      if (!state.columns.length)
        container.append(
          el('p', 'field-help', 'Load columns to choose what appears in your report.')
        );
      // A provider can offer hundreds of columns, so a long list gets a search box.
      $('column-search').hidden = state.columns.length <= 12;
      $('column-search').value = '';
      updateColumnCount();
    }
    function filterColumns() {
      const words = $('column-search').value.toLowerCase().split(/\s+/).filter(Boolean);
      const container = $('column-list');
      let group = null,
        shown = 0;
      container.querySelector('.column-empty')?.remove();
      for (const node of Array.from(container.children)) {
        if (node.classList.contains('column-group')) {
          group = node;
          group.hidden = true;
        } else if (node.classList.contains('column-option')) {
          node.hidden = !words.every((word) => node.dataset.search.includes(word));
          if (node.hidden) continue;
          shown++;
          if (group) group.hidden = false;
        }
      }
      if (!shown && words.length)
        container.append(el('p', 'field-help column-empty', 'No columns match your search.'));
    }
    function updateColumnCount() {
      $('selected-count').textContent = '(' + selectedColumnKeys().length + ')';
    }
    function updateDates() {
      const custom = !$('date-section').hidden && $('date-preset').value === 'custom';
      $('custom-dates').hidden = !custom;
      $('start-date').required = custom;
      $('end-date').required = custom;
    }
    function updateSchedule() {
      $('schedule-note').hidden = $('report-schedule').value === 'manual';
    }
    function collectReport(validate = true) {
      if (validate && !$('report-form').reportValidity()) return null;
      const fields = selectedColumnKeys();
      if (!fields.length) throw new Error('Choose at least one column for your report.');
      const dateRange = { preset: $('date-preset').value };
      if (dateRange.preset === 'custom') {
        dateRange.startDate = $('start-date').value;
        dateRange.endDate = $('end-date').value;
        if (currentReport()?.dateRange && dateRange.startDate > dateRange.endDate)
          throw new Error('The start date must be before the end date.');
      }
      return {
        ...(state.reportId ? { id: state.reportId } : {}),
        name: $('report-name').value.trim(),
        connectorId: $('report-provider').value,
        connectionId: $('report-connection').value,
        reportType: $('report-type').value,
        fields,
        config: readFields($('report-config'), currentReport()?.configFields || [], false),
        dateRange,
        target: {
          sheetName: $('target-sheet').value.trim(),
          startCell: $('target-cell').value.trim().toUpperCase(),
        },
        maxRows: Number($('row-limit').value),
        schedule: $('report-schedule').value,
      };
    }
    function editReport(report) {
      state.reportId = report.id || null;
      $('data-preview').hidden = true;
      fillProviders($('report-provider'), report.connectorId);
      changeProvider(report.reportType);
      refreshConnections(report.connectionId || '');
      renderReportFields(report.config || {}, report.fields);
      $('report-name').value = report.name;
      $('target-sheet').value = report.target?.sheetName || '';
      $('target-cell').value = report.target?.startCell || 'A1';
      $('row-limit').value = report.maxRows || state.limits.defaultRows;
      $('report-schedule').value = report.schedule || 'manual';
      $('date-preset').value = report.dateRange?.preset || 'last30';
      $('start-date').value = report.dateRange?.startDate || '';
      $('end-date').value = report.dateRange?.endDate || '';
      $('report-editor-title').textContent = 'Edit report';
      $('save-report').textContent = 'Save changes';
      updateDates();
      updateSchedule();
      tab('compose');
    }
    function renderPreview(result) {
      const rows = (result.rows || []).slice(0, 20);
      const columns = result.columns || [];
      const table = el('table');
      const head = el('thead');
      const headings = el('tr');
      columns.forEach((column) => headings.append(el('th', '', column.label || column.key)));
      head.append(headings);
      table.append(head);
      const body = el('tbody');
      rows.forEach((row) => {
        const tr = el('tr');
        columns.forEach((column, index) => {
          const value = Array.isArray(row) ? row[index] : row[column.key];
          tr.append(
            el(
              'td',
              '',
              value == null ? '' : typeof value === 'object' ? JSON.stringify(value) : value
            )
          );
        });
        body.append(tr);
      });
      table.append(body);
      $('preview-table').replaceChildren(table);
      $('preview-row-count').textContent = rows.length + ' sample rows';
      const metadata = result.metadata || {};
      const labels = [];
      if (metadata.currency) labels.push('Currency: ' + metadata.currency);
      if (metadata.timezone || metadata.timeZone)
        labels.push('Timezone: ' + (metadata.timezone || metadata.timeZone));
      if (result.totalRows != null)
        labels.push(result.totalRows.toLocaleString() + ' rows fetched');
      if (metadata.truncated) labels.push('Row limit reached');
      const container = $('preview-metadata');
      container.replaceChildren();
      if (labels.length) container.append(el('p', '', labels.join(' · ')));
      const warnings = Array.isArray(metadata.warnings)
        ? metadata.warnings
        : metadata.warnings
          ? [metadata.warnings]
          : [];
      if (metadata.warning) warnings.push(metadata.warning);
      if (metadata.note) warnings.push(metadata.note);
      if (metadata.attribution) container.append(el('p', '', metadata.attribution));
      warnings.forEach((warning) =>
        container.append(
          el(
            'p',
            'inline-note',
            typeof warning === 'object' ? warning.message || JSON.stringify(warning) : warning
          )
        )
      );
      if (!rows.length)
        container.append(
          el(
            'p',
            'inline-note',
            'No rows matched this report. Try a different date range or filter.'
          )
        );
      $('data-preview').hidden = false;
      $('data-preview').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }
    // A first open lands on a page explaining what DataMoov does. It is written after the
    // workspace is usable, and a failure here never disturbs the sidebar.
    async function offerWelcome() {
      try {
        const page = await api('dmvCreateWelcome');
        if (page?.sheetName)
          notice('Added a “' + page.sheetName + '” tab with the steps to get going.');
      } catch (ignored) {
        // The sidebar works perfectly well without the page.
      }
    }
    async function bootstrap() {
      resetDashboards();
      $('boot-state').hidden = false;
      $('retry-bootstrap').hidden = true;
      try {
        const data = await api('dmvBootstrap');
        state.catalog = data.catalog || [];
        state.connections = data.connections || [];
        state.credentials = data.credentials || [];
        state.families = data.credentialFamilies || [];
        state.reports = data.reports || [];
        state.dashboards = data.dashboards || [];
        state.limits = data.limits || state.limits;
        state.target = data.defaultTarget;
        if (data.dateTimezone)
          $('date-help').textContent =
            'Recent day ranges end yesterday. Date presets use ' +
            data.dateTimezone +
            '; provider reporting timezones appear in the preview.';
        $('sheet-options').replaceChildren(
          ...(data.sheetNames || []).map((name) => option(name, name))
        );
        renderReports();
        renderDashboards();
        scheduleDashboardPoll();
        renderConnections();
        renderCredentials();
        if (window.dmvChatUi) window.dmvChatUi.bootstrap(data);
        if (!state.loaded) {
          resetReport();
          resetConnection();
          resetCredential();
          $('report-fields').disabled = false;
          $('connection-fields').disabled = false;
          $('credential-fieldset').disabled = false;
          state.loaded = true;
        } else {
          refreshConnections();
          refreshCredentialChoices();
        }
        if (!credentialImportRunning) $('import-credentials').disabled = false;
        notice('');
        if (data.welcome?.offer) offerWelcome();
      } catch (error) {
        notice(error.message || 'Could not open the workspace.', 'error');
        $('retry-bootstrap').hidden = false;
      } finally {
        $('boot-state').hidden = true;
      }
    }
    document.querySelectorAll('[data-tab]').forEach((node) => {
      node.addEventListener('click', () => tab(node.dataset.tab));
      node.addEventListener('keydown', (event) => {
        if (!['ArrowLeft', 'ArrowRight', 'Home', 'End'].includes(event.key)) return;
        event.preventDefault();
        const index = TABS.indexOf(state.activeTab);
        const next =
          event.key === 'Home'
            ? 0
            : event.key === 'End'
              ? TABS.length - 1
              : (index + (event.key === 'ArrowRight' ? 1 : TABS.length - 1)) % TABS.length;
        tab(TABS[next]);
        $('tab-' + TABS[next]).focus();
      });
    });
    $('create-dashboard-chat').addEventListener('click', createDashboardInChat);
    $('new-report').addEventListener('click', () => {
      resetReport();
      tab('compose');
    });
    $('refresh-reports').addEventListener('click', (event) =>
      busy(event.currentTarget, '…', bootstrap)
    );
    $('retry-bootstrap').addEventListener('click', bootstrap);
    $('reset-report').addEventListener('click', () => {
      resetReport();
      tab('reports');
    });
    $('report-provider').addEventListener('change', () => {
      $('report-name').value = '';
      changeProvider();
    });
    $('report-type').addEventListener('change', () => {
      if (!state.reportId) $('report-name').value = '';
      renderReportFields();
    });
    $('date-preset').addEventListener('change', updateDates);
    $('report-schedule').addEventListener('change', updateSchedule);
    $('column-list').addEventListener('change', () => {
      state.columnsChosen = true;
      updateColumnCount();
    });
    $('column-search').addEventListener('input', filterColumns);
    $('report-config').addEventListener('change', () =>
      updateConditionalFields($('report-config'), currentReport()?.configFields || [])
    );
    $('connect-source').addEventListener('click', () =>
      openConnectionEditor($('report-provider').value, 'compose')
    );
    $('new-connection').addEventListener('click', () => openConnectionEditor());
    $('new-credential').addEventListener('click', () => {
      resetCredential();
      openCredentialEditor();
    });
    $('connection-provider').addEventListener('change', () => renderAuth());
    $('connection-credential').addEventListener('change', () => {
      renderCredentialInline();
      invalidateAccounts();
    });
    const authChanged = (event) => {
      const source = provider($('connection-provider').value);
      updateConditionalFields($('auth-fields'), connectionFields(source));
      if (!$('credential-inline').hidden)
        updateConditionalFields($('inline-credential-fields'), credentialFields(source));
      if (event.target.name === 'authMode') renderGuide();
      // Discovered choices belong to the credentials they were listed with.
      if (!(source?.accountDiscovery?.credentialKeys || []).includes(event.target.name))
        invalidateAccounts();
    };
    for (const id of ['auth-fields', 'inline-credential-fields']) {
      $(id).addEventListener('input', authChanged);
      $(id).addEventListener('change', authChanged);
    }
    $('open-window').addEventListener('click', (event) =>
      busy(event.currentTarget, '…', async () => {
        await api('showWindow');
        notice('DataMoov opened in a larger window.');
      })
    );
    // ---- Settings tab handlers ----
    $('sample-credentials').addEventListener('click', (event) =>
      busy(event.currentTarget, 'Preparing\u2026', async () => {
        const sample = await api('dmvCredentialSample');
        try {
          const url = URL.createObjectURL(new Blob([sample.json], { type: 'application/json' }));
          const link = document.createElement('a');
          link.href = url;
          link.download = sample.fileName;
          document.body.append(link);
          link.click();
          link.remove();
          setTimeout(() => URL.revokeObjectURL(url), 10000);
        } catch (error) {
          throw new Error(
            'This sidebar could not start the download. Use the ⤡ button to open DataMoov in a window and try again.'
          );
        }
        notice(
          'Sample saved as ' +
            sample.fileName +
            '. It covers every source with placeholder values; replace them with your own before importing.'
        );
      })
    );
    $('import-credentials').addEventListener('click', () => $('credential-import-file').click());
    $('credential-import-file').addEventListener('change', importCredentials);
    $('credential-family').addEventListener('change', () => renderCredentialFields());
    $('credential-fields').addEventListener('change', (event) => {
      updateConditionalFields(
        $('credential-fields'),
        family($('credential-family').value)?.fields || []
      );
      if (event.target.name === 'authMode') renderCredentialGuide();
    });
    $('cancel-credential').addEventListener('click', () => resetCredential());
    $('credential-form').addEventListener('submit', (event) => {
      event.preventDefault();
      const fam = family($('credential-family').value);
      const credential = {
        ...(state.credentialId ? { id: state.credentialId } : {}),
        label: $('credential-label').value.trim(),
        family: fam?.id,
        values: readFields($('credential-fields'), fam?.fields || [], true),
      };
      formBusy('credential-fieldset', 'save-credential', 'Saving…', async () => {
        const saved = await api('dmvSaveCredential', credential);
        upsert(state.credentials, saved);
        renderCredentials();
        refreshCredentialChoices();
        resetCredential(saved.family);
        notice(
          saved.verified
            ? 'Credential saved and verified with the provider.'
            : 'Credential saved. It is checked when you connect an account with it.'
        );
      });
    });
    $('discover-accounts').addEventListener('click', discoverAccounts);
    $('discovered-account').addEventListener('change', () => {
      const selected = $('discovered-account').value;
      const account = selected === '' ? null : state.accountChoices[Number(selected)];
      if (!account) return;
      const discovery = provider($('connection-provider').value)?.accountDiscovery;
      for (const key of discovery?.credentialKeys || []) {
        if ($('auth-' + key)) $('auth-' + key).value = account.credentials?.[key] || '';
      }
      $('account-discovery-status').textContent =
        (discovery?.label || 'Account') + ' filled in above. Save the connection to continue.';
    });
    $('cancel-connection').addEventListener('click', () => {
      const returnTo = state.connectionReturnTo;
      resetConnection();
      tab(returnTo);
    });
    $('connection-form').addEventListener('submit', (event) => {
      event.preventDefault();
      const source = provider($('connection-provider').value);
      const chosen = connectionCredentialInput();
      const connection = {
        ...(state.connectionId ? { id: state.connectionId } : {}),
        label: $('connection-label').value.trim(),
        connectorId: source.id,
        credentialId: chosen.credentialId,
        credentials: {
          ...readFields($('auth-fields'), connectionFields(source), true),
          ...(credentialChoice() === '__embedded' ? chosen.inline : {}),
        },
      };
      const returnTo = state.connectionReturnTo;
      if (!$('connection-chat-instructions').reportValidity()) return;
      const chatDraft = connectionChatChanged() ? $('connection-chat-instructions').value : null;
      formBusy('connection-fields', 'save-connection', 'Saving\u2026', async () => {
        if (chosen.newCredential) {
          // The new credential is saved first so it can be reused even if the connection fails.
          const credential = await api('dmvSaveCredential', chosen.newCredential);
          upsert(state.credentials, credential);
          renderCredentials();
          connection.credentialId = credential.id;
          refreshCredentialChoices();
          $('connection-credential').value = credential.id;
          renderCredentialInline();
        }
        const saved = await api('dmvSaveConnection', connection);
        upsert(state.connections, saved);
        renderConnections();
        renderCredentials();
        refreshConnections(saved.id);
        if (chatDraft !== null)
          try {
            await saveConnectionChat(saved.id, chatDraft);
          } catch (error) {
            // The connection itself is saved; keep the editor and the draft so Save can retry.
            state.connectionId = saved.id;
            $('connection-provider').disabled = true;
            $('connection-editor-title').textContent = 'Edit connection';
            $('save-connection').textContent = 'Save changes';
            loadConnectionChat(saved.id, true);
            notice(
              'Connection saved, but its chat instructions were not: ' +
                (error.message || 'try again.') +
                ' Your draft is kept.',
              'error'
            );
            return;
          }
        resetConnection(saved.connectorId);
        tab(returnTo);
        notice(
          saved.verified
            ? 'Connection saved and verified with the provider.'
            : 'Connection saved. Test it before running your first report.'
        );
      });
    });
    $('report-form').addEventListener('submit', (event) => {
      event.preventDefault();
      let report;
      try {
        report = collectReport();
      } catch (error) {
        notice(error.message, 'error');
        return;
      }
      if (!report) return;
      formBusy('report-fields', 'save-report', 'Saving…', async () => {
        const saved = await api('dmvSaveReport', report);
        upsertReport(saved);
        renderReports();
        resetReport();
        tab('reports');
        notice('Report saved. It stays private to your Google account.');
      });
    });
    $('discover-fields').addEventListener('click', (event) =>
      busy(event.currentTarget, 'Loading…', async () => {
        if (!$('report-connection').value)
          throw new Error('Add a connection before loading columns.');
        const fields = await api('dmvDiscoverFields', {
          connectionId: $('report-connection').value,
          reportType: $('report-type').value,
          config: readFields($('report-config'), currentReport()?.configFields || [], false),
        });
        // Once columns were picked by hand, those already listed keep their choice and new
        // ones start from their default. An untouched list takes the loaded defaults.
        const listed = new Set(state.columns.map((field) => field.key));
        const chosen = selectedColumnKeys();
        state.columns = Array.isArray(fields) ? fields : fields.fields || [];
        renderColumns(
          state.columnsChosen
            ? chosen
                .filter((key) => state.columns.some((field) => field.key === key))
                .concat(defaultColumnKeys().filter((key) => !listed.has(key)))
            : undefined
        );
        notice('Columns loaded. Choose the fields you need.');
      })
    );
    $('preview-report').addEventListener('click', () => {
      let report;
      try {
        report = collectReport();
      } catch (error) {
        notice(error.message, 'error');
        return;
      }
      if (!report) return;
      formBusy('report-fields', 'preview-report', 'Loading…', async () => {
        renderPreview(await api('dmvPreviewReport', report));
        notice('Preview ready. No sheet data was changed.');
      });
    });
    if (window.DATAMOOV_LOCAL_PREVIEW === true) $('preview-banner').hidden = false;
    // Inside the larger window there is nothing wider to open.
    if (window.innerWidth >= 440) $('open-window').hidden = true;
    // The chat partial builds on these helpers; nothing else is exposed.
    window.addEventListener('pagehide', () => {
      dashboardView.disposed = true;
      resetDashboards();
    });
    window.dmvSidebar = {
      api,
      el,
      button,
      notice,
      provider,
      state,
      tab,
      refreshDashboards,
      sheetLink,
    };
    tab('reports');
    bootstrap();
  })();
</script>
