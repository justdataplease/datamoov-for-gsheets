<style>
  :root {
    color-scheme: light;
    --ink: #172033;
    --muted: #6c7488;
    --line: #e6e9f1;
    --primary: #5146d6;
    --primary-dark: #4236bd;
    --wash: #f7f8fc;
    --success: #237753;
    --danger: #b73e46;
    --radius: 12px;
    font-family:
      Inter,
      -apple-system,
      BlinkMacSystemFont,
      'Segoe UI',
      sans-serif;
    font-size: 13px;
    color: var(--ink);
    background: var(--wash);
  }
  * {
    box-sizing: border-box;
  }
  body {
    margin: 0;
  }
  button,
  input,
  select,
  textarea {
    font: inherit;
  }
  button {
    cursor: pointer;
  }
  button:disabled {
    cursor: wait;
    opacity: 0.55;
  }
  button:focus-visible,
  input:focus-visible,
  select:focus-visible,
  textarea:focus-visible,
  [tabindex]:focus-visible {
    outline: 2px solid #8379ed;
    outline-offset: 2px;
  }
  [hidden] {
    display: none !important;
  }
  .app-shell {
    max-width: 460px;
    min-height: 100vh;
    margin: 0 auto;
    background: #fff;
    display: flex;
    flex-direction: column;
  }
  .app-header {
    padding: 23px 18px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .brand-mark {
    width: 34px;
    height: 34px;
    background: var(--primary);
    color: white;
    border-radius: 10px;
    display: grid;
    place-items: center;
    box-shadow: 0 3px 7px #5146d620;
  }
  .brand-mark svg {
    width: 26px;
    height: 26px;
  }
  .brand strong {
    font-size: 21px;
    font-weight: 740;
    letter-spacing: -0.7px;
    display: block;
    line-height: 1.05;
  }
  .brand div > span {
    display: block;
    font-size: 8px;
    letter-spacing: 1.3px;
    font-weight: 650;
    color: var(--muted);
    margin-top: 5px;
  }
  .edition {
    font-size: 10px;
    letter-spacing: 0.3px;
    background: var(--wash);
    border: 1px solid var(--line);
    border-radius: 5px;
    padding: 4px 7px;
    color: var(--muted);
  }
  .tabs {
    display: flex;
    padding: 0 12px;
    border-bottom: 1px solid var(--line);
    position: sticky;
    top: 0;
    z-index: 3;
    background: #fff;
  }
  .tabs button {
    position: relative;
    border: 0;
    background: none;
    color: var(--muted);
    padding: 13px 3px 12px;
    flex: 1;
    font-size: 11px;
    font-weight: 650;
    white-space: nowrap;
  }
  .tabs button[aria-selected='true'] {
    color: var(--primary);
  }
  .tabs button[aria-selected='true']:after {
    content: '';
    position: absolute;
    height: 2px;
    border-radius: 2px;
    background: var(--primary);
    bottom: -1px;
    left: 8px;
    right: 8px;
  }
  .tab-count {
    font-size: 9px;
    background: #f0eefc;
    color: var(--primary);
    border-radius: 5px;
    padding: 2px 4px;
    margin-left: 5px;
  }
  main {
    padding: 0 16px 22px;
    flex: 1;
  }
  .section-heading {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 8px;
    margin: 23px 0 20px;
  }
  h1 {
    font-size: 18px;
    letter-spacing: -0.4px;
    margin: 0;
    font-weight: 650;
  }
  h2 {
    font-size: 13px;
    font-weight: 650;
    margin: 0;
    letter-spacing: -0.15px;
  }
  p {
    line-height: 1.6;
    margin: 0;
  }
  .section-heading p {
    color: var(--muted);
    font-size: 11px;
    margin-top: 5px;
  }
  .icon-button {
    border: 1px solid var(--line);
    border-radius: 7px;
    background: #fff;
    padding: 2px 8px;
    color: var(--muted);
    font-size: 20px;
    line-height: 1.25;
  }
  .icon-button:hover {
    background: var(--wash);
  }
  .card-list {
    display: grid;
    gap: 12px;
    margin-bottom: 15px;
  }
  .report-card,
  .connection-card {
    border: 1px solid var(--line);
    border-radius: var(--radius);
    background: #fff;
    overflow: hidden;
  }
  .card-content {
    padding: 13px;
  }
  .card-top {
    display: flex;
    gap: 9px;
    align-items: center;
    margin-bottom: 13px;
    min-width: 0;
  }
  .provider-badge {
    background: #eeedff;
    color: var(--primary);
    width: 30px;
    height: 30px;
    border-radius: 8px;
    display: grid;
    place-items: center;
    font-size: 10px;
    font-weight: 750;
    flex-shrink: 0;
  }
  .card-title {
    font-size: 12px;
    font-weight: 650;
    line-height: 1.45;
    overflow-wrap: anywhere;
    min-width: 0;
  }
  .card-subtitle {
    font-size: 10px;
    color: var(--muted);
    margin-top: 2px;
  }
  .status {
    font-size: 9px;
    font-weight: 650;
    padding: 3px 6px;
    white-space: nowrap;
    border-radius: 20px;
    background: #f0f2f6;
    color: #687183;
    margin-left: auto;
    align-self: flex-start;
  }
  .status.success {
    background: #edf7f1;
    color: var(--success);
  }
  .status.error {
    background: #fff0ef;
    color: var(--danger);
  }
  .status.running,
  .status.paused {
    background: #f0edff;
    color: var(--primary);
  }
  .card-detail {
    display: flex;
    gap: 7px;
    align-items: baseline;
    line-height: 1.6;
    color: var(--muted);
    font-size: 10px;
  }
  .card-detail strong {
    font-weight: 550;
    color: #4d576b;
    overflow-wrap: anywhere;
  }
  .card-bottom {
    padding: 9px 12px;
    border-top: 1px solid #eff0f5;
    display: flex;
    align-items: center;
    gap: 13px;
    background: #fcfcfe;
  }
  .card-bottom .run-button {
    margin-left: auto;
  }
  .text-button {
    padding: 0;
    border: 0;
    background: transparent;
    color: var(--primary);
    font-size: 11px;
    font-weight: 600;
    text-align: left;
    line-height: 1.5;
  }
  .text-button:hover {
    text-decoration: underline;
  }
  .text-button.subtle {
    color: var(--muted);
  }
  .text-button.danger {
    color: var(--danger);
  }
  .run-button {
    border: 1px solid #dfdbff;
    border-radius: 6px;
    color: var(--primary);
    background: #f4f2ff;
    font-size: 10px;
    padding: 5px 9px;
    font-weight: 650;
  }
  .run-button:hover {
    background: #eae7ff;
  }
  .button {
    display: inline-flex;
    justify-content: center;
    align-items: center;
    gap: 7px;
    padding: 10px 12px;
    min-height: 37px;
    font-size: 11px;
    font-weight: 650;
    border: 1px solid transparent;
    border-radius: 8px;
    line-height: 1.4;
    transition: background 0.15s;
  }
  .button.primary {
    background: var(--primary);
    color: #fff;
    box-shadow: 0 2px 3px #5146d616;
  }
  .button.primary:hover {
    background: var(--primary-dark);
  }
  .button.secondary {
    background: #fff;
    color: #4d556b;
    border-color: #dfe3ec;
  }
  .button.secondary:hover {
    background: var(--wash);
  }
  .full {
    width: 100%;
  }
  .footnote,
  .field-help {
    font-size: 10px;
    color: var(--muted);
    line-height: 1.65;
    margin: 7px 0 12px;
  }
  .footnote {
    margin: 14px 2px;
    text-align: center;
    font-size: 9px;
  }
  .empty-state {
    padding: 26px 14px;
    text-align: center;
    border: 1px dashed #dcdfee;
    border-radius: var(--radius);
    background: #fcfcff;
  }
  .empty-state .empty-icon {
    font-size: 24px;
    color: #a59dda;
    display: block;
    margin-bottom: 9px;
  }
  .empty-state strong {
    font-size: 12px;
    display: block;
    margin-bottom: 7px;
  }
  .empty-state p {
    font-size: 11px;
    color: var(--muted);
  }
  .notice {
    margin-top: 14px;
    border-radius: 8px;
    padding: 10px 12px;
    font-size: 11px;
    line-height: 1.6;
    overflow-wrap: anywhere;
    background: #edf7f1;
    color: #246d4f;
    border: 1px solid #d5eadd;
  }
  .notice.error {
    background: #fff1f0;
    color: #a93840;
    border-color: #f4d7d7;
  }
  .notice.info {
    background: #f1effe;
    color: var(--primary);
    border-color: #e2defb;
  }
  .boot-state {
    font-size: 11px;
    color: var(--muted);
    padding: 24px 0;
    display: flex;
    gap: 8px;
    align-items: center;
  }
  .spinner {
    width: 13px;
    height: 13px;
    border: 2px solid #dedbf8;
    border-top-color: var(--primary);
    border-radius: 50%;
    animation: spin 1s linear infinite;
  }
  @keyframes spin {
    to {
      transform: rotate(360deg);
    }
  }
  fieldset {
    padding: 0;
    margin: 0;
    border: 0;
    min-width: 0;
  }
  label {
    font-size: 11px;
    font-weight: 600;
    display: block;
    margin: 13px 0 6px;
  }
  input,
  select,
  textarea {
    display: block;
    width: 100%;
    border: 1px solid #dfe3ec;
    border-radius: 7px;
    padding: 9px 10px;
    background: #fff;
    color: var(--ink);
    font-size: 11px;
    min-height: 36px;
  }
  input::placeholder,
  textarea::placeholder {
    color: #9a9faf;
  }
  textarea {
    min-height: 85px;
    resize: vertical;
    line-height: 1.6;
  }
  select {
    padding-right: 5px;
  }
  input[type='checkbox'] {
    width: 13px;
    height: 13px;
    min-height: 0;
    padding: 0;
    margin: 0;
    accent-color: var(--primary);
    flex-shrink: 0;
  }
  .step-heading {
    display: flex;
    align-items: center;
    gap: 8px;
    border-top: 1px solid var(--line);
    padding-top: 19px;
    margin-top: 22px;
  }
  .step-heading:first-child {
    border-top: 0;
    padding-top: 0;
    margin-top: 0;
  }
  .step-heading > span {
    border-radius: 6px;
    background: #f0eefc;
    color: var(--primary);
    font-size: 10px;
    font-weight: 700;
    width: 21px;
    height: 21px;
    display: grid;
    place-items: center;
  }
  .field-heading {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 7px;
    margin-top: 15px;
    margin-bottom: 7px;
  }
  .field-heading label {
    margin: 0;
  }
  .muted {
    color: var(--muted);
    font-size: 10px;
    font-weight: 400;
  }
  .column-list {
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 6px 10px;
    max-height: 230px;
    overflow: auto;
  }
  .column-group {
    font-size: 9px;
    text-transform: uppercase;
    letter-spacing: 0.8px;
    color: #9298aa;
    margin: 9px 0 5px;
    font-weight: 650;
  }
  .column-option {
    display: flex;
    align-items: center;
    gap: 8px;
    font-weight: 450;
    font-size: 11px;
    padding: 6px 0;
    margin: 0;
    line-height: 1.4;
    cursor: pointer;
  }
  .column-option .column-type {
    margin-left: auto;
    color: #a1a7b5;
    font-size: 9px;
  }
  .two-columns {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }
  .target-grid {
    display: grid;
    grid-template-columns: minmax(0, 1fr) 74px;
    gap: 10px;
  }
  .inline-note {
    font-size: 10px;
    line-height: 1.7;
    background: var(--wash);
    border-radius: 7px;
    padding: 9px 11px;
    color: var(--muted);
    margin: 8px 0;
  }
  .inline-note .text-button {
    display: block;
    margin-top: 4px;
  }
  .action-row {
    display: flex;
    gap: 9px;
    margin-top: 18px;
  }
  .action-row > * {
    flex: 1;
  }
  .connection-editor {
    border-top: 1px solid var(--line);
    padding-top: 8px;
    margin-top: 23px;
  }
  .connection-editor > .field-heading {
    margin-bottom: 18px;
  }
  .connection-card .card-top {
    margin-bottom: 0;
  }
  .card-error {
    font-size: 10px;
    color: var(--danger);
    line-height: 1.6;
    overflow-wrap: anywhere;
    margin-top: 7px;
  }
  .card-progress {
    font-size: 10px;
    color: var(--primary);
    line-height: 1.6;
    margin-top: 7px;
  }
  .app-footer {
    font-size: 9px;
    color: #9298a8;
    border-top: 1px solid var(--line);
    padding: 15px 17px;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .app-footer a {
    color: var(--primary);
    text-decoration: none;
    font-weight: 600;
  }
  .app-footer a:hover {
    text-decoration: underline;
  }
  .app-footer .heart {
    color: #e0457b;
  }
  .footer-brand {
    margin-left: auto;
    color: #848a9a;
    font-weight: 600;
  }
  .data-preview {
    border-top: 1px solid var(--line);
    margin-top: 23px;
    padding-top: 4px;
  }
  .table-scroll {
    border: 1px solid var(--line);
    border-radius: 7px;
    overflow: auto;
    max-height: 260px;
  }
  table {
    border-collapse: collapse;
    min-width: 100%;
    font-size: 10px;
    text-align: left;
  }
  th,
  td {
    padding: 8px 10px;
    border-bottom: 1px solid #eceef4;
    white-space: nowrap;
    max-width: 250px;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  th {
    background: var(--wash);
    font-size: 9px;
    color: #636c81;
    font-weight: 600;
    position: sticky;
    top: 0;
  }
  tr:last-child td {
    border-bottom: 0;
  }
  .preview-metadata {
    font-size: 10px;
    color: var(--muted);
    margin-bottom: 8px;
    line-height: 1.6;
  }
  .preview-banner {
    padding: 8px 12px;
    text-align: center;
    background: #fff4d8;
    color: #8b691d;
    font-size: 9px;
    font-weight: 650;
    letter-spacing: 0.2px;
  }
  .setup-guide {
    border: 1px solid var(--line);
    border-radius: 8px;
    background: var(--wash);
    padding: 0 12px;
    margin-top: 12px;
    font-size: 11px;
    line-height: 1.6;
  }
  .setup-guide summary {
    cursor: pointer;
    padding: 10px 0;
    font-weight: 650;
    color: var(--primary);
    list-style: none;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .setup-guide summary::-webkit-details-marker {
    display: none;
  }
  .setup-guide summary::before {
    content: '';
    width: 6px;
    height: 6px;
    border-right: 2px solid currentColor;
    border-bottom: 2px solid currentColor;
    transform: rotate(-45deg);
    transition: transform 0.15s;
  }
  .setup-guide[open] summary::before {
    transform: rotate(45deg);
  }
  .setup-guide[open] summary {
    border-bottom: 1px solid var(--line);
  }
  .guide-intro {
    margin: 10px 0 6px;
    color: var(--ink);
  }
  .guide-steps {
    margin: 0 0 10px;
    padding-left: 18px;
    color: var(--muted);
  }
  .guide-steps li {
    margin: 4px 0;
    overflow-wrap: anywhere;
  }
  .guide-steps li::marker {
    color: var(--primary);
    font-weight: 650;
  }
  .guide-links {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    padding-bottom: 12px;
  }
  .guide-links a.chip {
    text-decoration: none;
  }
  .auth-field {
    min-width: 0;
  }
  .account-discovery {
    border: 1px solid var(--line);
    background: var(--wash);
    border-radius: 8px;
    padding: 10px;
    margin-top: 12px;
  }
  .account-discovery .field-help {
    overflow-wrap: anywhere;
  }
  .auth-field input[readonly] {
    background: var(--wash);
    color: var(--muted);
  }
  .auth-field[hidden] {
    display: none;
  }
  .auth-field textarea.secret {
    font-family: ui-monospace, monospace;
  }
  .report-card:hover {
    border-color: #d8d6ee;
  }
  .connection-card:hover {
    border-color: #d8d6ee;
  }
  .visually-hidden {
    position: absolute;
    width: 1px;
    height: 1px;
    overflow: hidden;
    clip: rect(0 0 0 0);
    white-space: nowrap;
  }
  .heading-actions {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-shrink: 0;
  }
  .ai-settings {
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 4px 14px 14px;
    margin-bottom: 18px;
    background: #fcfcff;
  }
  .ai-settings .field-heading {
    margin-top: 12px;
  }
  .chip-row {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin: 10px 0 12px;
  }
  .chip {
    border: 1px solid #dfdbff;
    background: #f4f2ff;
    color: var(--primary);
    border-radius: 14px;
    padding: 5px 10px;
    font-size: 10px;
    font-weight: 600;
    text-align: left;
    line-height: 1.4;
    max-width: 100%;
    overflow-wrap: anywhere;
  }
  .chip:hover {
    background: #eae7ff;
  }
  .chat-messages {
    display: grid;
    gap: 10px;
    margin-bottom: 12px;
  }
  .chat-message {
    border-radius: 10px;
    padding: 10px 12px;
    font-size: 11px;
    line-height: 1.6;
    max-width: 100%;
    overflow-wrap: anywhere;
  }
  .chat-message.user {
    background: var(--primary);
    color: #fff;
    margin-left: 28px;
    border-bottom-right-radius: 3px;
  }
  .chat-message.assistant {
    background: var(--wash);
    border: 1px solid var(--line);
    margin-right: 18px;
    border-bottom-left-radius: 3px;
  }
  .chat-message.error {
    background: #fff1f0;
    border-color: #f4d7d7;
    color: #a93840;
  }
  .chat-text {
    white-space: pre-wrap;
  }
  .chat-events {
    list-style: none;
    margin: 8px 0 0;
    padding: 8px 0 0;
    border-top: 1px solid #e9ebf2;
    font-size: 10px;
    color: var(--muted);
  }
  .chat-events li {
    display: flex;
    gap: 6px;
    line-height: 1.6;
  }
  .chat-events li::before {
    content: '\2713';
    color: var(--success);
    flex-shrink: 0;
  }
  .chat-events li.error::before {
    content: '\2716';
    color: var(--danger);
  }
  .chat-message .chip-row {
    margin: 10px 0 0;
  }
  .chat-composer {
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto;
    gap: 8px;
    align-items: end;
  }
  .chat-composer textarea {
    min-height: 58px;
  }
  .chat-composer .button {
    min-height: 40px;
  }
  @media (min-width: 380px) {
    main {
      padding-left: 23px;
      padding-right: 23px;
    }
    .app-header {
      padding: 25px 24px 22px;
    }
    .tabs {
      padding: 0 20px;
    }
    .tabs button {
      font-size: 12px;
    }
    .section-heading p {
      font-size: 12px;
    }
    .card-title {
      font-size: 13px;
    }
    .card-subtitle,
    .card-detail {
      font-size: 11px;
    }
    label,
    input,
    select,
    textarea,
    .column-option {
      font-size: 12px;
    }
    .button {
      font-size: 12px;
    }
    .card-content {
      padding: 16px;
    }
    .card-bottom {
      padding: 10px 15px;
    }
    .field-help {
      font-size: 11px;
    }
  }
  @media (prefers-reduced-motion: reduce) {
    * {
      animation: none !important;
      transition: none !important;
    }
  }
</style>
