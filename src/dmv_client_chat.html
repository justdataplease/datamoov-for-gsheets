<script>
  (function () {
    'use strict';
    const $ = (id) => document.getElementById(id);
    const { api, el, button, notice, provider, state, tab, sheetLink } = window.dmvSidebar;
    // generation changes on every reset; a reply from an older generation is dropped.
    const chat = {
      ai: null,
      transcript: [],
      busy: false,
      settingsOpen: false,
      settingsDirty: false,
      generation: 0,
      active: null,
    };

    function providerInfo(id) {
      return (chat.ai?.providers || []).find((item) => item.id === id);
    }
    function renderSettings() {
      if (chat.settingsDirty) return;
      const configured = Boolean(chat.ai?.configured);
      const select = $('ai-provider');
      const previous = select.value;
      select.replaceChildren();
      for (const item of chat.ai?.providers || []) {
        const option = el('option', '', item.label);
        option.value = item.id;
        select.append(option);
      }
      select.value = configured ? chat.ai.provider : previous || select.value;
      updateProviderFields(configured ? chat.ai.model : '');
      $('ai-key').value = '';
      $('ai-key').placeholder = configured ? 'Saved — leave blank to keep' : '';
      $('ai-key').required = !configured;
      $('ai-instructions').value = configured ? chat.ai.instructions || '' : '';
      $('ai-max-rows').value = chat.ai?.maxRows || 10000;
      $('ai-debug').checked = chat.ai?.debug !== false;
      updateInstructionCount();
      $('ai-remove').hidden = !configured;
      $('ai-test').hidden = !configured;
    }
    function updateInstructionCount() {
      const stored = Number.isFinite(chat.ai?.instructionCharacters)
        ? chat.ai.instructionCharacters
        : (chat.ai?.instructions || '').length +
          Object.values(chat.ai?.sourceInstructions || {}).reduce(
            (total, value) => total + String(value).length,
            0
          ) +
          Object.values(chat.ai?.connectionInstructions || {}).reduce(
            (total, value) => total + String(value).length,
            0
          );
      const count =
        stored - (chat.ai?.instructions || '').length + $('ai-instructions').value.length;
      const over = count > 100000;
      $('ai-instruction-count').textContent =
        count.toLocaleString() + ' / 100,000 characters across all instructions';
      $('ai-instruction-count').className = 'field-help instruction-count' + (over ? ' error' : '');
      $('ai-instructions').setCustomValidity(
        over
          ? 'Keep all general and connection instructions within 100,000 characters combined.'
          : ''
      );
    }
    function updateProviderFields(model) {
      const info = providerInfo($('ai-provider').value);
      const help = $('ai-key-help');
      help.replaceChildren(info?.keyHelp || '');
      if (/^https:\/\//.test(info?.keyUrl || '')) {
        const link = el('a', '', 'Create a key ↗');
        link.href = info.keyUrl;
        link.target = '_blank';
        link.rel = 'noopener';
        help.append(' ', link);
      }
      const current = $('ai-model').value.trim();
      const isDefault = (chat.ai?.providers || []).some((item) => item.defaultModel === current);
      if (model !== undefined && model !== '') $('ai-model').value = model;
      else if (!current || isDefault) $('ai-model').value = info?.defaultModel || '';
    }
    function render() {
      const configured = Boolean(chat.ai?.configured);
      // The settings card sits under Settings: open until a key is saved, collapsed afterwards.
      $('ai-settings').open = !configured || chat.settingsOpen;
      $('ai-row-limit').textContent =
        Number(chat.ai?.maxRows || 10000).toLocaleString() + ' rows per report';
      const status = $('ai-settings-status');
      status.textContent = configured
        ? chat.ai.providerLabel + ' · ' + chat.ai.model
        : 'Not set up';
      status.className = 'card-status' + (configured ? ' ok' : '');
      $('chat-setup').hidden = configured;
      $('chat-ready').hidden = !configured;
      $('chat-settings-toggle').hidden = !configured;
      $('chat-new').hidden = !configured || !$('chat-messages').childElementCount;
      if (configured)
        $('ai-status').textContent =
          'Using ' +
          chat.ai.providerLabel +
          ' · ' +
          chat.ai.model +
          '. Your key is stored privately in your Google account.';
      renderSuggestions();
    }
    function openSettings() {
      chat.settingsOpen = true;
      renderSettings();
      render();
      tab('settings');
      $('ai-settings').scrollIntoView({ behavior: 'smooth', block: 'start' });
      $('ai-key').focus();
    }
    function renderSuggestions() {
      const row = $('chat-suggestions');
      row.replaceChildren();
      if (chat.transcript.length) return;
      const ideas = [];
      const connections = state.connections.slice(0, 2);
      for (const connection of connections) {
        const source = provider(connection.connectorId);
        const report = source?.reports?.[0];
        if (!report) continue;
        ideas.push(
          report.dateRange
            ? source.label +
                ' ' +
                report.label.toLowerCase() +
                ' for the last 30 days, in a new tab'
            : 'Run the ' +
                source.label +
                ' ' +
                report.label.toLowerCase() +
                ' report into a new tab'
        );
      }
      if (connections.length) ideas.push('Which campaign had the highest spend last month?');
      ideas.push(
        connections.length ? 'Chart daily clicks for the last 14 days' : 'What can you do?'
      );
      for (const idea of ideas.slice(0, 3)) row.append(button(idea, 'chip', () => send(idea)));
    }
    // Render model text only through DOM text nodes; no HTML, images or remote resources.
    function appendInline(parent, text, depth = 0) {
      if (depth > 6) {
        parent.append(document.createTextNode(text));
        return;
      }
      let plain = '';
      const flush = () => {
        if (plain) parent.append(document.createTextNode(plain));
        plain = '';
      };
      for (let index = 0; index < text.length;) {
        if (
          text[index] === '\\' &&
          index + 1 < text.length &&
          /[\\`*_\[\]{}()#+.!|>-]/.test(text[index + 1])
        ) {
          plain += text[index + 1];
          index += 2;
          continue;
        }
        const rest = text.slice(index);
        const image = /^!\[[^\]\n]*\]\([^\n]*?\)/.exec(rest);
        if (image) {
          plain += image[0];
          index += image[0].length;
          continue;
        }
        const code = /^(`+)([^\n]*?)\1(?!`)/.exec(rest);
        if (code) {
          flush();
          parent.append(el('code', '', code[2]));
          index += code[0].length;
          continue;
        }
        const link = /^\[([^\]\n]+)\]\(([^\s)]+)\)/.exec(rest);
        if (link) {
          let url;
          try {
            url = new URL(link[2]);
          } catch {}
          if (url && ['http:', 'https:'].includes(url.protocol) && !url.username && !url.password) {
            flush();
            const node = el('a');
            node.href = url.href;
            node.target = '_blank';
            node.rel = 'noopener noreferrer';
            appendInline(node, link[1], depth + 1);
            parent.append(node);
          } else plain += link[0];
          index += link[0].length;
          continue;
        }
        const marker =
          rest.startsWith('**') || rest.startsWith('__')
            ? rest.slice(0, 2)
            : rest[0] === '*' || rest[0] === '_'
              ? rest[0]
              : '';
        if (
          marker &&
          !/\s/.test(rest[marker.length] || ' ') &&
          !(marker[0] === '_' && /[\p{L}\p{N}]/u.test(text[index - 1] || ''))
        ) {
          const end = text.indexOf(marker, index + marker.length);
          if (end > index + marker.length && !/\s/.test(text[end - 1])) {
            flush();
            const node = el(marker.length === 2 ? 'strong' : 'em');
            appendInline(node, text.slice(index + marker.length, end), depth + 1);
            parent.append(node);
            index = end + marker.length;
            continue;
          }
        }
        plain += text[index++];
      }
      flush();
    }
    function markdown(text) {
      const body = el('div', 'chat-text markdown');
      const lines = String(text || '')
        .replace(/\r\n?/g, '\n')
        .split('\n');
      const fence = (line) => /^\s{0,3}```/.test(line);
      const heading = (line) => /^(#{1,6})\s+(.+)$/.exec(line);
      const listItem = (line) => /^\s{0,3}([-+*]|\d+[.)])\s+(.+)$/.exec(line);
      const tableRule = (line) =>
        /^\s*\|?\s*:?-{3,}:?\s*(?:\|\s*:?-{3,}:?\s*)+\|?\s*$/.test(line || '');
      const cells = (line) =>
        line
          .trim()
          .replace(/^\|/, '')
          .replace(/\|$/, '')
          .split('|')
          .map((cell) => cell.trim());
      for (let index = 0; index < lines.length;) {
        const line = lines[index];
        if (!line.trim()) {
          index++;
          continue;
        }
        if (fence(line)) {
          const code = [];
          index++;
          while (index < lines.length && !fence(lines[index])) code.push(lines[index++]);
          if (index < lines.length) index++;
          const pre = el('pre');
          pre.append(el('code', '', code.join('\n')));
          body.append(pre);
          continue;
        }
        const title = heading(line);
        if (title) {
          const node = el('h' + title[1].length);
          appendInline(node, title[2]);
          body.append(node);
          index++;
          continue;
        }
        if (line.includes('|') && tableRule(lines[index + 1])) {
          const scroll = el('div', 'chat-table-scroll');
          scroll.tabIndex = 0;
          scroll.setAttribute('role', 'region');
          scroll.setAttribute('aria-label', 'Response table');
          const table = el('table'),
            head = el('thead'),
            header = el('tr');
          for (const value of cells(line)) {
            const cell = el('th');
            cell.scope = 'col';
            appendInline(cell, value);
            header.append(cell);
          }
          head.append(header);
          table.append(head);
          index += 2;
          const tbody = el('tbody');
          while (index < lines.length && lines[index].includes('|') && lines[index].trim()) {
            const row = el('tr');
            for (const value of cells(lines[index++])) {
              const cell = el('td');
              appendInline(cell, value);
              row.append(cell);
            }
            tbody.append(row);
          }
          table.append(tbody);
          scroll.append(table);
          body.append(scroll);
          continue;
        }
        const first = listItem(line);
        if (first) {
          const ordered = /^\d/.test(first[1]),
            list = el(ordered ? 'ol' : 'ul');
          if (ordered) list.start = Math.min(Number.parseInt(first[1], 10) || 1, 1000000);
          while (index < lines.length) {
            const item = listItem(lines[index]);
            if (!item || /^\d/.test(item[1]) !== ordered) break;
            const node = el('li');
            appendInline(node, item[2]);
            list.append(node);
            index++;
          }
          body.append(list);
          continue;
        }
        const paragraph = [line];
        index++;
        while (
          index < lines.length &&
          lines[index].trim() &&
          !fence(lines[index]) &&
          !heading(lines[index]) &&
          !listItem(lines[index]) &&
          !(lines[index].includes('|') && tableRule(lines[index + 1]))
        )
          paragraph.push(lines[index++]);
        const node = el('p');
        appendInline(node, paragraph.join('\n'));
        body.append(node);
      }
      return body;
    }
    function scrollToMessage(node) {
      node.scrollIntoView({
        behavior: window.matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth',
        block: 'nearest',
      });
    }
    function addMessage(role, text, extra = {}) {
      const node = el('div', 'chat-message ' + role + (extra.error ? ' error' : ''));
      node.append(role === 'assistant' ? markdown(text) : el('div', 'chat-text', text));
      if (extra.options?.length) {
        const row = el('div', 'chip-row');
        for (const option of extra.options)
          row.append(button(option, 'chip', () => send('Use ' + option + '.')));
        node.append(row);
      }
      const recovering = extra.events?.some((event) => event.action === 'updated_incomplete');
      const saved = recovering || extra.events?.some((event) => event.kind === 'dashboard');
      const refreshed = extra.events?.some(
        (event) => event.kind === 'dashboard' && event.action === 'refreshed'
      );
      const written = extra.events?.some(
        (event) => event.kind === 'write' || event.kind === 'chart'
      );
      if (saved) {
        const savedOnly = extra.events.some((event) => event.action === 'saved') && !refreshed;
        const guidance = el(
          'p',
          'field-help chat-dashboard-status',
          recovering
            ? 'Dashboard tabs updated; saving refresh status needs recovery. '
            : refreshed
              ? 'Dashboard saved and refreshed. '
              : savedOnly
                ? written
                  ? 'Dashboard setup saved. Check the action details for its refresh status. '
                  : 'Dashboard setup saved. Its output has not been refreshed in this reply. '
                : 'Your dashboard is saved. '
        );
        guidance.append(
          document.createTextNode(
            'Find it under Reports > Dashboards and use Refresh dashboard for new data. '
          )
        );
        guidance.append(
          button('View dashboards', 'text-button', () => {
            tab('reports');
            $('dashboards-section')?.scrollIntoView({ behavior: 'smooth', block: 'start' });
          })
        );
        node.append(guidance);
      }
      if (written || refreshed) {
        const outputs = el('div', 'chat-output-links');
        outputs.append(el('p', 'field-help', 'Sheets updated. Open your output:'));
        const list = el('ul');
        const seen = new Set();
        for (const event of extra.events || []) {
          if (!['write', 'chart', 'dashboard'].includes(event.kind)) continue;
          for (const output of Array.isArray(event.links) ? event.links : []) {
            const link = sheetLink(String(output?.label || 'Open sheet'), output?.url);
            if (!link) continue;
            const key = link.href.split('&range=')[0];
            if (seen.has(key)) continue;
            seen.add(key);
            const item = el('li');
            item.append(link);
            list.append(item);
          }
        }
        if (seen.size) outputs.append(list);
        else outputs.firstElementChild.textContent = 'Sheets updated.';
        node.append(outputs);
      }
      if (extra.events?.length) {
        const debug = chat.ai?.debug !== false;
        const errors = extra.events.filter((event) => event.kind === 'error');
        const failed = extra.error || errors.some((event) => !event.recovered);
        const recovered = failed ? 0 : errors.length;
        const written = extra.events.some(
          (event) => event.kind === 'write' || event.kind === 'chart'
        );
        if (debug || failed) {
          const actions = el('details', 'chat-actions');
          actions.open = debug;
          const summary = el(
            'summary',
            failed ? 'error' : '',
            (debug ? 'Actions' : 'Action details') +
              (failed ? ' \u00b7 Some actions failed' : '') +
              (recovered
                ? ' \u00b7 Recovered from ' +
                  recovered +
                  (recovered === 1 ? ' failed step' : ' failed steps')
                : '') +
              (failed && written ? ' \u00b7 Sheet updated' : '')
          );
          actions.append(summary);
          const list = el('ul', 'chat-events');
          for (const event of extra.events) {
            const item = el(
              'li',
              event.kind === 'error' && !event.recovered ? 'error' : '',
              event.text + (event.recovered ? ' (retried successfully)' : '')
            );
            list.append(item);
          }
          actions.append(list);
          node.append(actions);
        }
      }
      $('chat-messages').append(node);
      scrollToMessage(node);
      return node;
    }
    function requestId() {
      if (window.crypto?.randomUUID) return window.crypto.randomUUID();
      if (!window.crypto?.getRandomValues)
        throw new Error('Reload the sidebar to start a secure chat request.');
      return Array.from(window.crypto.getRandomValues(new Uint8Array(16)), (value) =>
        value.toString(16).padStart(2, '0')
      ).join('');
    }
    function currentTurn(turn) {
      return chat.active === turn && turn.generation === chat.generation && !turn.stopped;
    }
    function stopProgress() {
      const turn = chat.active;
      if (turn) {
        turn.stopped = true;
        window.clearTimeout(turn.timer);
      }
      chat.active = null;
      $('chat-working-steps').replaceChildren();
      $('chat-working-text').textContent = 'Working on your request\u2026';
    }
    function renderProgress(turn, result) {
      if (
        !currentTurn(turn) ||
        result?.requestId !== turn.requestId ||
        result.status === 'unavailable'
      )
        return;
      if (
        !['running', 'complete', 'failed'].includes(result.status) ||
        !Array.isArray(result.steps) ||
        Number(result.updatedAt) < turn.updatedAt
      )
        return;
      turn.updatedAt = Number(result.updatedAt) || turn.updatedAt;
      turn.steps = result.steps
        .slice(-60)
        .filter(
          (step) =>
            step &&
            ['running', 'complete', 'error'].includes(step.state) &&
            typeof step.text === 'string'
        );
      const active =
        turn.steps.filter((step) => step.state === 'running').at(-1) || turn.steps.at(-1);
      if (active) $('chat-working-text').textContent = active.text;
      const list = $('chat-working-steps');
      list.replaceChildren();
      for (const step of turn.steps) {
        const item = el('li', step.state);
        item.append(
          el(
            'span',
            'visually-hidden',
            { running: 'In progress', complete: 'Completed', error: 'Failed' }[step.state] + ': '
          ),
          document.createTextNode(step.text)
        );
        list.append(item);
      }
    }
    function startProgress(turn) {
      const poll = async () => {
        if (!currentTurn(turn)) return;
        let result;
        try {
          result = await api('dmvChatProgress', { requestId: turn.requestId });
        } catch {
          /* A missing progress update does not interrupt the chat request. */
        }
        if (!currentTurn(turn)) return;
        renderProgress(turn, result);
        if (result?.requestId === turn.requestId && ['complete', 'failed'].includes(result.status))
          return;
        turn.timer = window.setTimeout(poll, 1200);
      };
      turn.timer = window.setTimeout(poll, 1200);
    }
    async function send(text) {
      text = String(text || '').trim();
      if (!text || chat.busy || !chat.ai?.configured) return;
      const generation = chat.generation;
      let turn;
      setBusy(true);
      $('chat-input').value = '';
      $('chat-suggestions').replaceChildren();
      addMessage('user', text);
      try {
        turn = {
          requestId: requestId(),
          generation,
          stopped: false,
          timer: null,
          steps: [],
          updatedAt: 0,
        };
        chat.active = turn;
        startProgress(turn);
        const reply = await api('dmvChat', {
          text,
          transcript: chat.transcript,
          requestId: turn.requestId,
        });
        if (!currentTurn(turn)) return;
        chat.transcript.push(...(reply.transcriptAppend || []));
        if (reply.events?.some((event) => event.kind === 'dashboard'))
          window.dmvSidebar.refreshDashboards().catch(() => {
            // Dashboard status is independent of the completed answer.
          });
        addMessage('assistant', reply.text || '', {
          events: reply.events,
          options: reply.options,
          error: Boolean(reply.failed),
          dashboard: reply.events?.some((event) => event.kind === 'dashboard'),
        });
      } catch (error) {
        if (generation !== chat.generation || (turn && !currentTurn(turn))) return;
        addMessage('assistant', error.message || 'The question could not be answered.', {
          error: true,
          events: turn?.steps
            .filter((step) => step.state !== 'running')
            .map((step) => ({
              kind: step.state === 'error' ? 'error' : 'activity',
              text: step.text,
            })),
        });
      } finally {
        if (generation === chat.generation && (!turn || chat.active === turn)) {
          stopProgress();
          setBusy(false);
          $('chat-input').focus();
        }
      }
    }
    // While a turn runs, the conversation and the provider cannot be reset from under it.
    function setBusy(busy) {
      chat.busy = busy;
      $('chat-send').disabled = busy;
      $('chat-input').disabled = busy;
      $('chat-working').hidden = !busy;
      $('chat-new').disabled = busy;
      $('ai-remove').disabled = busy;
      $('chat-new').hidden = !$('chat-messages').childElementCount && !busy;
    }
    function resetConversation() {
      stopProgress();
      chat.generation++;
      chat.transcript = [];
      $('chat-messages').replaceChildren();
      setBusy(false);
    }
    $('ai-form').addEventListener('input', () => {
      chat.settingsDirty = true;
    });
    $('ai-form').addEventListener('change', () => {
      chat.settingsDirty = true;
    });
    $('ai-provider').addEventListener('change', () => updateProviderFields());
    $('ai-instructions').addEventListener('input', updateInstructionCount);
    $('ai-form').addEventListener('submit', (event) => {
      event.preventDefault();
      updateInstructionCount();
      if (!$('ai-form').reportValidity()) return;
      const input = {
        provider: $('ai-provider').value,
        apiKey: $('ai-key').value,
        model: $('ai-model').value.trim(),
        instructions: $('ai-instructions').value.trim(),
        maxRows: Number($('ai-max-rows').value),
        debug: $('ai-debug').checked,
      };
      const fieldset = $('ai-fields');
      fieldset.disabled = true;
      api('dmvSaveAiSettings', input)
        .then((saved) => {
          chat.ai = saved;
          chat.settingsDirty = false;
          chat.settingsOpen = false;
          renderSettings();
          render();
          notice('AI provider saved. Use Test to check the key, then ask a question in Chat.');
        })
        .catch((error) => notice(error.message, 'error'))
        .finally(() => {
          fieldset.disabled = false;
        });
    });
    $('ai-test').addEventListener('click', (event) => {
      const node = event.currentTarget;
      node.disabled = true;
      node.textContent = 'Testing…';
      api('dmvTestAi')
        .then((result) => notice(result.message || 'The AI provider replied.'))
        .catch((error) => notice(error.message, 'error'))
        .finally(() => {
          node.disabled = false;
          node.textContent = 'Test';
        });
    });
    $('ai-remove').addEventListener('click', () => {
      if (!window.confirm('Remove the saved AI provider and key? Chat will need a key again.'))
        return;
      api('dmvDeleteAiSettings')
        .then((summary) => {
          chat.ai = summary;
          chat.settingsDirty = false;
          resetConversation();
          renderSettings();
          render();
          notice('AI provider removed.');
        })
        .catch((error) => notice(error.message, 'error'));
    });
    $('ai-settings').addEventListener('toggle', () => {
      chat.settingsOpen = $('ai-settings').open;
    });
    $('chat-settings-toggle').addEventListener('click', openSettings);
    $('chat-open-settings').addEventListener('click', openSettings);
    $('chat-new').addEventListener('click', () => {
      if (chat.busy) return;
      resetConversation();
      render();
    });
    $('chat-form').addEventListener('submit', (event) => {
      event.preventDefault();
      send($('chat-input').value);
    });
    $('chat-input').addEventListener('keydown', (event) => {
      if (event.key === 'Enter' && !event.shiftKey) {
        event.preventDefault();
        send($('chat-input').value);
      }
    });
    window.addEventListener('pagehide', () => {
      stopProgress();
      chat.generation++;
      setBusy(false);
    });
    window.dmvChatUi = {
      updateAiSettings(summary) {
        chat.ai = summary;
        renderSettings();
        updateInstructionCount();
        render();
      },
      bootstrap(data) {
        chat.ai = data.ai || { configured: false, providers: [] };
        renderSettings();
        render();
      },
    };
  })();
</script>
